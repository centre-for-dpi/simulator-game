  for(let y=1;y<=10;y++){
    const r=G.years[y-1];
    if(r) rows+=`<tr><td class="yr">${y}</td><td><span class="codes">${r.codes||""}</span>${r.flags.length>1?`<br><span class="flags">${r.flags.map(id=>byId(id).flag).join("")}</span>`:""}</td><td class="mono">${r.adopt}%</td><td class="mono">${r.trust}</td><td class="mono">${fmtPeople(r.reached)}</td></tr>`;
    else if(y===cur && !done && !G.over) rows+=`<tr class="now"><td class="yr">${y}</td><td colspan="4">In progress…</td></tr>`;
    else rows+=`<tr class="empty"><td class="yr">${y}</td><td colspan="4"></td></tr>`;
  }
  return `<aside class="record" aria-label="Ten-year record"><table>
    <thead><tr><th>Yr</th><th>Rails</th><th>Adopt</th><th>Trust</th><th>Reached</th></tr></thead><tbody>${rows}</tbody></table></aside>`;
}
function metersHTML(){
  return `<div class="badge">${badgeHTML()}</div>`+statsFor().map(s=>{
    const v=G.stats[s.k], d=G.delta[s.k];
    const w=s.k==="cash"?clamp(v/1.5):v;
    const danger = s.k==="cash" ? v<12 : (s.k==="pol"||s.k==="trust") && v<20;
    return `<div class="meter${danger?" danger":""}" style="--c:${s.c}">
      <div class="m-head"><span class="m-dot"></span><span class="m-label">${lab(s)}</span>
        <span class="m-val">${s.k==="cash"?"$"+v:v}</span>
        <span class="m-delta ${d>0?"up":d<0?"down":""}">${d?(d>0?"+":"")+d:""}</span></div>
      <div class="m-track"><div class="m-fill" style="width:${w}%"></div></div>
    </div>`;}).join("")+
    reachHTML()+shelfHTML()+
    `<div class="meters-foot">${isAdv()?"The engagement ends early if your influence or public trust hits zero, or the program runs out of money.":"The game ends early if political capital or trust hits zero, or the budget goes negative. You are the program's champion: with political capital or trust below 20, or adoption under 5% after year 3, a cabinet reshuffle can replace you."}</div>`;
}

function lineHTML(){
  let h="";
  const finished=G.screen==="end"||G.screen==="over";
  for(let t=0;t<G.total;t++){
    const done=t<G.turn || (t===G.turn && (G.screen==="result"||G.screen==="news"||finished));
    const cur=t===G.turn && G.screen==="decision";
    const log=G.log.find(l=>l.turn===t);
    const ms=G.ms.filter(m=>m.turn===t).map(m=>MILESTONES.find(x=>x.id===m.id).code);
    const lost=G.screen==="over" && t===Math.min(G.turn,G.total-1);
    const tip=log?log.title+": "+log.choice:(G.electionTurns.includes(t)?"Election":elapsed(G.weeks[t]));
    h+=`<div class="stn${G.total>20?" slim":""}${done?" done":""}${cur?" cur":""}${G.electionTurns.includes(t)?" elec":""}${log&&log.fu?" fu":""}${lost?" gamelost":""}" title="${esc(tip)}">
      ${ms.length?`<span class="star">★ ${ms.join(" ")}</span>`:""}
      <span class="dot"></span><span class="lbl">${shortElapsed(G.weeks[t])}<br>${calendar(G.weeks[t]).replace(" ","&nbsp;")}</span></div>`;
  }
  return `<nav class="linemap" aria-label="Ten-year journey"><div class="linemap-inner">${h}</div></nav>`;
}

function deltaChips(d){
  const ks=statsFor().filter(s=>d[s.k]);
  const pv=d.priv?`<span class="dchip up" style="--c:var(--l-eco)"><i></i>Private services <b>+${fmtPeople(d.priv/100*country(G).pop)}</b></span>`:"";
  if(!ks.length) return `<div class="deltas"><span class="dchip">No immediate change</span></div>`;
  const ppl=d.adopt?`<span class="dchip ${d.adopt>0?"up":"down"}" style="--c:var(--l-adopt)"><i></i>People <b>${d.adopt>0?"+":"−"}${fmtPeople(Math.abs(d.adopt)/100*country(G).pop)}</b></span>`:"";
  return `<div class="deltas">${ks.map(s=>{const v=d[s.k];
    return `<span class="dchip ${v>0?"up":"down"}" style="--c:${s.c}"><i></i>${shortLab(s)} <b>${v>0?"+":""}${s.k==="cash"?"$"+v+"M":v}</b></span>`}).join("")}${ppl}${pv}</div>`;
}
function driftLine(d,gap){
  const parts=statsFor().filter(s=>d[s.k]).map(s=>`${shortLab(s)} ${d[s.k]>0?"+":""}${s.k==="cash"?"$"+d[s.k]+"M":d[s.k]}`);
  return parts.length?`<div class="drift">Over the next ${gap}: ${parts.join(" · ")}</div>`:"";
}
function msBanner(ids){
  return (ids||[]).map(id=>{const m=MILESTONES.find(x=>x.id===id);
    return `<div class="trophy" role="status"><span class="trophy-cup roundel">${m.code}</span>
      <div><span class="eyebrow">Trophy won</span><b>${m.name}</b><p>${m.why}</p><small>${m.desc}</small></div></div>`}).join("");
}
function forOf(s){
  if(s&&s.id==="pside") return {flag:byId(G.pside).flag, name:byId(G.pside).name};
  if(s&&s.id==="market"&&G.market&&G.market.kind==="country") return {flag:"🌐", name:"CDPI portfolio"};
  const c=country(G); return {flag:c.flag, name:c.name};
}
function forChip(f){ return `<span class="for" title="${esc(isAdv()?"Advice for "+f.name:"Decision for "+f.name)}"><span class="for-flag" aria-hidden="true">${f.flag}</span>${esc(f.name)}</span>`; }
function clockHTML(t){ const w=weekOf(t); return `<span class="clock"><b>${elapsed(w)}</b> <span>· ${calendar(w)}</span></span>`; }

function renderGame(){
  const c=country(G), b=block(G), ph=phaseOf(G.turn), isElec=G.electionTurns.includes(G.turn)&&G.screen==="decision";
  let stage="";
  if(G.screen==="decision"){
    const s=scen(G.cur);
    stage=`<article class="card" aria-live="polite">
      ${G.timer?`<div class="timer" id="timerbar"></div>`:""}
      <div class="card-meta"><span class="meta-l"><span class="cat${s.cat==="Crisis"||s.cat==="Migration"?" crisis":s.cat==="Climate"?" climate":""}">${s.cat}</span>${forChip(forOf(s))}</span><span class="kbd">${isAdv()&&G.portfolio.length?`Country ${G.focus==null?1:G.focus+2} of ${G.portfolio.length+1} this quarter · `:""}Quarter ${G.turn+1} of ${G.total}${G.timer?' · <span class="timer-label" id="timerlabel"></span>':""}</span></div>
      ${G.cause?`<div class="because">${G.causeLabel?esc(G.causeLabel)+":":"Because you chose"} <b>${esc(G.cause)}</b></div>`:""}
      <h2>${tpl(s.title)}</h2>
      <p class="lede">${tpl(s.text)}</p>
      ${isAdv()?`<div class="prompt">${s.self?"Your call as CDPI":`What do you advise the government? <span class="kbd">${G.stats.pol>=70?"Influence 70+: they will almost always take your advice.":G.stats.pol<40?"Influence below 40: they will go their own way.":"Influence 40–69: they may or may not listen"+((G.stats.rep||0)>=60?", and CDPI's reputation helps.":".")}</span>`}</div>`:""}
      ${s.market?`<div class="market">${G.optIdx.map((oi,i)=>{const o=s.opts[oi];
        return `<button class="offer${o.stay?" stay":""}" data-i="${i}"><span class="key">${"ABCD"[i]}</span>
          <span class="eyebrow">${esc(o.tag)}</span><b>${esc(o.name)}</b>
          ${o.flag?`<span class="offer-flag" aria-hidden="true">${o.flag}</span>`:`<span class="roundel offer-code">${esc(o.code)}</span>`}
          <span class="kbd">${esc(o.sub)}</span></button>`}).join("")}</div>`:
      `<div class="opts">${G.optIdx.map((oi,i)=>{const o=s.opts[oi];
        return `<button class="opt" data-i="${i}"><span class="key">${"ABCD"[i]}</span><span>${tpl(o.t)}</span>${o.privSector?(G.stats.eco>=70?`<span class="risky ready" title="Ecosystem 70 or more: private partners can deliver">Private sector ready</span>`:`<span class="risky" title="Ecosystem below 70: private partners may not deliver. Influence helps.">Private sector · may backfire</span>`):""}${o.risk?(o.pure?`<span class="risky" title="Elections are unpredictable: influence and reputation do not change the odds">Gamble · anyone's guess</span>`:o.delivery&&deliveryReady(G)?`<span class="risky ready" title="ID, payments, data exchange and an ID–account mapper are in place">Rails ready</span>`
          :gambleBand()==="sure"?(weakBase()?`<span class="risky" title="Strong influence, but tech capacity or the ecosystem is below 30, so it could still fail">Gamble · weak base</span>`:`<span class="risky ready" title="${isAdv()?"Influence":"Political capital"} of 70 or more: this gamble will very likely pay off, though politics can still surprise you">Gamble · in your favour</span>`)
          :gambleBand()==="backfire"?`<span class="risky bad" title="${isAdv()?"Influence":"Political capital"} below 40: this gamble backfires">Gamble · will backfire</span>`
          :`<span class="risky" title="${isAdv()?"Influence":"Political capital"} 40–69: it could go either way${isAdv()?"; CDPI reputation of 60 or more tips it your way":""}">Gamble</span>`):""}</button>`}).join("")}</div>`}
      <div class="kbd">Press 1–${G.optIdx.length} or A–${"ABCD"[G.optIdx.length-1]} to choose</div>
    </article>`;
  } else if(G.screen==="result"){
    const r=G.res;
    stage=`<article class="card" aria-live="polite">
      <div class="card-meta"><span class="meta-l"><span class="cat${r.cat==="Crisis"||r.cat==="Migration"?" crisis":r.cat==="Climate"?" climate":""}">${r.cat} · outcome</span>${forChip(r.forc||forOf(null))}</span>${r.privFail?`<span class="gamble lost">The private sector was not ready</span>`:""}${r.ego?`<span class="gamble lost">Political backfire</span>`:""}${r.antiDpi?`<span class="gamble lost" title="Point-to-point, copies, monoliths and lock-in cost capacity, ecosystem and political capital">Not a DPI approach</span>`:""}${r.gamble?`<span class="gamble ${r.gamble}">${r.gamble==="won"?"The gamble paid off":"The gamble backfired"}</span>`:""}</div>
      ${r.advice?`<div class="advice"><span>You advised: <b>${esc(r.advice.advised)}</b></span>${r.advice.accepted
        ?`<span class="ok">${r.advice.same?"The government was already leaning this way.":"The government took your advice."}</span>`
        :`<span><span class="no">The government went another way:</span> <b>${esc(r.choice)}</b></span>`}</div>`
       :`<div class="chosen">${esc(r.title)} · ${isAdv()?"CDPI chose":"you chose"} <b>${esc(r.choice)}</b></div>`}
      <p class="lede">${r.out}</p>
      ${deltaChips(r.delta)}
      ${driftLine(r.drift, r.gap)}
      <div class="lens"><span class="eyebrow">CDPI lens</span>${r.lens}</div>
      ${r.foreshadow?`<div class="foreshadow">This decision will come back to you.</div>`:""}
      ${msBanner(r.ms)}
      <div class="actions"><button class="btn" id="next">${r.last?"See where ten years took you →":"Jump ahead "+r.gap+" →"}</button><span class="kbd">Enter</span></div>
    </article>`;
  } else if(G.screen==="crisis"){
    const n=NEWS.find(x=>x.id===G.crisis.id);
    stage=`<article class="card" aria-live="polite">
      <div class="card-meta"><span class="meta-l"><span class="cat crisis">Crisis · meanwhile</span>${forChip(forOf(null))}</span>${clockHTML(G.turn)}</div>
      <h2>${G.crisis.title}</h2>
      <p class="lede">${G.crisis.text}</p>
      <div class="prompt">${isAdv()?"The minister calls you into the crisis room. Pick a response":"Pick a response"}</div>
      <div class="opts">${n.opts.map((o,i)=>`<button class="opt" data-c="${i}"><span class="key">${"AB"[i]}</span><span>${tpl(o.t)}</span></button>`).join("")}</div>
      <div class="kbd">Press 1–2 or A–B to choose</div>
    </article>`;
  } else if(G.screen==="news"){
    const n=G.news;
    stage=`<article class="card" aria-live="polite">
      <div class="card-meta"><span class="meta-l"><span class="cat">Meanwhile</span>${forChip(G.news&&G.news.forId?{flag:byId(G.news.forId).flag,name:byId(G.news.forId).name}:forOf(null))}</span>${clockHTML(G.turn)}</div>
      <h2>${n.title}</h2>
      ${n.choice?`<div class="chosen">Response: <b>${esc(n.choice)}</b></div>`:""}
      <p class="lede">${n.text}</p>
      ${deltaChips(n.delta)}
      ${msBanner(n.ms)}
      <div class="actions"><button class="btn" id="next">Continue →</button><span class="kbd">Enter</span></div>
    </article>`;
  }
  setHTML(app,`
    <header class="topbar">
      <div class="brand">Build the <span>Rails</span></div>
      <div class="ctx"><span class="flag" aria-hidden="true">${c.flag}</span>${c.name} · ${G.blocks.length?G.blocks.map(id=>BLOCKS.find(x=>x.id===id).code).join("+"):block(G).code+" advisory"} · ${USECASES.find(u=>u.id===G.usecase).name}${realUcs().length>1?" +"+(realUcs().length-1):""} · ${ROLES[G.role].short}${G.team?` · <span style="font-weight:400">${esc(G.team)}</span>`:""}</div>
      <div class="when">${clockHTML(G.turn)}<span class="phase ph-${isElec?"E":ph}">${isElec?"Election":PHASES[ph]}</span>
        <button class="btn ghost small" id="quit">Restart</button></div>
    </header>
    <div class="board">
      <aside class="meters" aria-label="Indicators">${metersHTML()}</aside>
      <main class="stage">${stage}</main>
      ${recordHTML()}
    </div>
    ${lineHTML()}`);
  app.querySelectorAll(".opt[data-i],.offer[data-i]").forEach(el=>el.onclick=()=>choose(+el.dataset.i));
  app.querySelectorAll(".opt[data-c]").forEach(el=>el.onclick=()=>resolveCrisis(+el.dataset.c));
  app.querySelector("#next")?.addEventListener("click",advance);
  app.querySelector("#next")?.focus({preventScroll:true});
  app.querySelector("#quit").onclick=confirmQuit;
  const tb=app.querySelector("#timerbar");
  if(tb) tb.addEventListener("animationend",()=>{ tb.classList.add("done"); const l=app.querySelector("#timerlabel"); if(l) l.textContent="Time. Decide!"; });
  const lm=app.querySelector(".linemap"), st=app.querySelector(".stn.cur")||[...app.querySelectorAll(".stn.done")].pop();
  if(lm&&st) lm.scrollLeft=st.offsetLeft-lm.clientWidth/2;
}

function confirmQuit(){
  const btn=app.querySelector("#quit");
  if(btn.dataset.armed){ G=null; render(); scrollTo(0,0); return; }
  btn.dataset.armed="1"; btn.textContent="Click again to quit";
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent="Restart"; } },3000);
}

function summaryText(){
  const c=country(G), b=block(G), sc=score();
  return [`Build the Rails · ${ROLES[G.role].short} · ${c.name} · ${b.name} · ${usecase(G).name}${G.team?" · "+G.team:""}`,
    `New people reached: ${fmtPeople(impactReached())} (${fmtPeople(totalReached(G))} on the rails in total)${(G.portfolio||[]).length?` across ${1+G.portfolio.length} countries (${[country(G),...G.portfolio.map(p=>byId(p.id))].map(x=>x.name).join(", ")})`:""}`,
    ...(isAdv()&&G.advised?[`Advice taken: ${G.accepted} of ${G.advised}`]:[]),
    `Rails: ${railsText()} · Use cases: ${G.ucs.map(id=>USECASES.find(u=>u.id===id).name).join(", ")}`,
    G.won?`WON: one billion people reached by ${elapsed(weekOf(G.won.turn))}`:G.over?`Ended early (${elapsed(weekOf(G.turn))}): ${G.over.title}`:`Result after ten years: ${rating(sc)[0]} (${sc} pts)`,
    "Final: "+statsFor().map(s=>`${shortLab(s)} ${s.k==="cash"?"$"+G.stats.cash+"M":G.stats[s.k]}`).join(" · "),
    "Milestones: "+(G.ms.map(m=>MILESTONES.find(x=>x.id===m.id).name).join(", ")||"none"), "",
    ...G.log.map(l=>`${elapsed(G.weeks[l.turn])} (${calendar(G.weeks[l.turn])}) · ${l.title}: ${l.choice}${l.gamble?` (gamble ${l.gamble})`:""}${l.advice&&!l.advice.accepted?` [CDPI advised: ${l.advice.advised}]`:""}`)].join("\n");
}

function renderEnd(){
  const c=country(G), b=block(G), sc=score(), nC=1+(G.portfolio||[]).length;
  const [rt,rd]=G.over?[G.over.title,G.over.text]
    :G.won?["One billion people",`Mission accomplished. By ${elapsed(weekOf(G.won.turn))}, DPI and AI services reach ${fmtPeople(G.won.reached)} new people${nC>1?` across ${nC} countries`:` in ${c.name}`}.`]
    :rating(sc);
  G.delta={};
  setHTML(app,`
    <header class="topbar">
      <div class="brand">Build the <span>Rails</span></div>
      <div class="ctx"><span class="flag" aria-hidden="true">${c.flag}</span>${c.name} · ${G.blocks.length?G.blocks.map(id=>BLOCKS.find(x=>x.id===id).code).join("+"):block(G).code+" advisory"} · ${USECASES.find(u=>u.id===G.usecase).name}${realUcs().length>1?" +"+(realUcs().length-1):""} · ${ROLES[G.role].short}${G.team?` · <span style="font-weight:400">${esc(G.team)}</span>`:""}</div>
      <div class="when">${G.over?clockHTML(G.turn):G.won?clockHTML(G.won.turn):`<span class="clock"><b>Year 10</b> <span>· ${calendar(HORIZON)}</span></span>`}</div>
    </header>
    <div class="board">
      <aside class="meters" aria-label="Final indicators">${metersHTML()}</aside>
      <main class="stage" style="display:grid;gap:22px;min-width:0">
        <div class="end-hero">
          <div class="eyebrow">${G.over?"Game over · "+elapsed(weekOf(G.turn)):G.won?"You won · the mission is complete":"Ten years in "+c.name+" · the billion was not reached"}</div>
          <div class="rating${G.over?" bad":G.won?" won":""}">${rt}</div>
          <p class="lede">${rd}</p>
          ${G.over&&G.over.reshuffle?`<div class="lens"><span class="eyebrow">CDPI lens</span>Champions survive reshuffles when they have political capital, public trust and visible results. Institutional anchoring (a law, a budget line, cross-government governance) protects the program even when people change.</div>`:""}
          ${G.over&&G.over.corrupt?`<div class="lens"><span class="eyebrow">CDPI lens</span>Integrity is non-negotiable in public infrastructure. Bribes, kickbacks, undeclared conflicts of interest and vendor gifts end careers and programs, and they destroy the trust DPI depends on.</div>`:""}
          <div class="impact"><span class="eyebrow">Impact · new people reached</span><b>${fmtPeople(impactReached())}</b><span>${(G.portfolio||[]).length?`across ${1+G.portfolio.length} countries you advised`:`in ${c.name}`} · ${fmtPeople(totalReached(G))} on the rails in total, ${fmtPeople(baseReached())} of them already there when you started</span></div>
          ${G.over?"":`<div class="score secondary">Score <b>${sc}</b> · adoption, trust, ecosystem, capacity, milestones and budget</div>`}
          ${isAdv()&&(G.lost||[]).length?`<div class="score">Engagements lost <b>${G.lost.length}</b> · ${G.lost.map(l=>byId(l.id).flag+" "+byId(l.id).name+(l.why==="sacked"?" (sacked)":" (shut out)")).join(", ")}</div>`:""}
          ${isAdv()&&G.advised?`<div class="score">Advice taken <b>${G.accepted}/${G.advised}</b> · ${Math.round(100*G.accepted/G.advised)}% of your recommendations</div>`:""}
        </div>
        <div class="actions">
          <button class="btn" id="again">Play again</button>
          <button class="btn ghost" id="copy">Copy summary</button>
          <span class="kbd" id="copymsg"></span>
        </div>
        <textarea class="copybox" id="copybox" hidden readonly aria-label="Summary text">${esc(summaryText())}</textarea>
        <div class="two">
          <section><div class="section-title">Milestones</div><div class="ms-list">
            ${MILESTONES.map(m=>{const got=G.ms.find(x=>x.id===m.id);
              return `<div class="ms-item${got?"":" off"}"><span class="roundel">${m.code}</span><div><b>${m.name}</b><br><span class="kbd">${got?elapsed(G.weeks[got.turn])+" · "+calendar(G.weeks[got.turn]):m.desc}</span>${got?`<div class="ms-why">${m.why}</div>`:""}</div></div>`}).join("")}
          </div></section>
          <section style="min-width:0"><div class="section-title">Your journey</div><div class="journey">
            ${G.log.map(l=>`<div class="j-row"><span class="mono">${shortElapsed(G.weeks[l.turn])} · ${calendar(G.weeks[l.turn])}</span><div><b>${esc(l.title)}${l.fu?" ↳":""}</b><span>${esc(l.choice)}${l.gamble?` · gamble ${l.gamble}`:""}${l.advice&&!l.advice.accepted?` · you advised: ${esc(l.advice.advised)}`:""}</span></div></div>`).join("")}
          </div></section>
        </div>
      </main>
      ${recordHTML()}
    </div>
    ${lineHTML()}`);
  app.querySelector("#again").onclick=()=>{ G=null; render(); scrollTo(0,0); };
  app.querySelector("#copy").onclick=()=>{
    const txt=summaryText(), msg=app.querySelector("#copymsg"), box=app.querySelector("#copybox");
    const fallback=()=>{ box.hidden=false; box.focus(); box.select(); msg.textContent="Select and copy the text below."; };
    try{ navigator.clipboard.writeText(txt).then(()=>{msg.textContent="Copied. Paste it in the meeting chat.";},fallback); }catch(e){ fallback(); }
  };
}

document.addEventListener("keydown",e=>{
  if(!G || e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
  if(G.screen==="decision"){
    const k=e.key.toLowerCase(); let i=-1;
    if(/^[1-4]$/.test(k)) i=+k-1; else if(/^[a-d]$/.test(k)) i="abcd".indexOf(k);
    if(i>=0 && i<G.optIdx.length){ e.preventDefault(); choose(i); }
  } else if(G.screen==="crisis"){
    const k=e.key.toLowerCase(); const i=k==="1"||k==="a"?0:k==="2"||k==="b"?1:-1;
    if(i>=0){ e.preventDefault(); resolveCrisis(i); }
  } else if((G.screen==="result"||G.screen==="news") && e.key==="Enter" && e.target.id!=="next"){
    e.preventDefault(); advance();
  }
});

/* Keep an in-progress game across live updates of the page. */
window.claude?.hot?.snapshot?.(()=>({G,UI}));
function boot(data){ if(data&&data.UI) UI=data.UI; if(data&&data.G) G=data.G; render(); }
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
