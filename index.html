<title>Build the Rails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a transit control room. Each metric is a metro line (left rail), the decision sits centre stage,
   and the country's ten-year journey is drawn as a line map of stations along the bottom. */
:root{
  --bg:#E8ECF0; --surface:#FAFBFC; --sunk:#DDE3E9; --ink:#13202B; --muted:#55636F; --rule:#C6D0D9;
  --accent:#0A7A60; --accent-ink:#FFFFFF; --good:#1D7C4D; --bad:#B6322A; --warn:#A86F0C;
  --l-rep:#A93F72; --l-pol:#C8372D; --l-cash:#C38500; --l-trust:#1F8A4C; --l-cap:#2458C6; --l-adopt:#0A8787; --l-eco:#7A3FB0;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#15202A; --sunk:#0A1016; --ink:#E3E9EE; --muted:#93A2AE; --rule:#283745;
  --accent:#35C49B; --accent-ink:#04221A; --good:#4CC27E; --bad:#F06A5E; --warn:#E8B04A;
  --l-rep:#E77AAA; --l-pol:#F0685D; --l-cash:#F0B635; --l-trust:#4CC27E; --l-cap:#6F98FF; --l-adopt:#3CC8C8; --l-eco:#B487E8;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#15202A; --sunk:#0A1016; --ink:#E3E9EE; --muted:#93A2AE; --rule:#283745;
  --accent:#35C49B; --accent-ink:#04221A; --good:#4CC27E; --bad:#F06A5E; --warn:#E8B04A;
  --l-rep:#E77AAA; --l-pol:#F0685D; --l-cash:#F0B635; --l-trust:#4CC27E; --l-cap:#6F98FF; --l-adopt:#3CC8C8; --l-eco:#B487E8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- Setup ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end;padding-block:40px 28px;border-bottom:2px solid var(--ink)}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(56px,9vw,112px);line-height:.86;letter-spacing:-.01em;text-transform:uppercase}
.hero h1 span{color:var(--accent)}
.hero p{margin:14px 0 0;max-width:56ch;color:var(--muted);font-size:17px}
.legend{display:grid;gap:8px}
.legend-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.legend-row b{font-weight:600}
.legend-row small{color:var(--muted);display:block;line-height:1.35}
.linechip{height:8px;border-radius:4px;background:var(--c);position:relative}
.linechip::after{content:"";position:absolute;right:-2px;top:50%;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--c);transform:translateY(-50%)}

.step{padding-block:28px 8px;display:grid;gap:14px}
.step-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.step-num{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;color:var(--accent)}
.step-head h2{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.01em}
.step-head p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;gap:10px}
.countries{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.blocks{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.roles{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.roles .roundel{width:54px;height:54px;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{background:transparent;border:1.5px solid var(--rule);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.advice{display:grid;gap:4px;font-size:14.5px;border:1.5px dashed var(--rule);border-radius:8px;padding:10px 14px}
.advice b{font-weight:600}
.advice .ok{color:var(--good);font-weight:600}
.advice .no{color:var(--bad);font-weight:600}
.prompt{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.pick{background:var(--surface);border:1.5px solid var(--rule);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start;transition:border-color .15s}
.pick:hover{border-color:var(--muted)}
.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pick .row{display:flex;align-items:center;gap:10px}
.flag{font-size:26px;line-height:1}
.pick h3{font-size:17px;font-weight:700}
.pick .sub{font-size:13px;color:var(--muted);line-height:1.4}
.traits{display:flex;flex-wrap:wrap;gap:4px}
.trait.cdpi{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.dot-rail{display:inline-flex;gap:3px;align-items:center}
.dot-rail .kbd{font-size:9.5px;margin-right:2px}
.dot-rail i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:inline-block}
.dot-rail i.on{background:var(--accent)}
.dpimap{display:block;margin-top:8px;font-size:13.5px}
.cdpi-now{display:inline-block;margin-top:6px;font-size:14px}
.trait{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.roundel{width:44px;height:44px;border-radius:50%;border:4px solid var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;flex:none;background:var(--surface)}
.dpg{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.country-pick{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.country-detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;
  background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;padding:18px;display:grid;gap:14px;align-content:start}
.cd-empty p{margin:6px 0 0;color:var(--muted)}
.cd-head{display:flex;gap:12px;align-items:center}
.cd-flag{font-size:40px;line-height:1}
.cd-head h3{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.cd-ctx{margin:0;font-size:14.5px}
.cd-cdpi{font-size:14px;border-left:4px solid var(--rule);padding:6px 0 6px 12px;display:grid;gap:2px}
.cd-cdpi.on{border-color:var(--accent)}
.cd-cdpi b{color:var(--accent)}
.cd-rails{display:grid;gap:8px;border-top:1px solid var(--rule);padding-top:12px}
.cd-rails-head{display:flex;justify-content:space-between;align-items:baseline}
.cd-rails-head b{font-size:18px}
.cd-rail{display:grid;grid-template-columns:96px 34px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px}
.cd-rail-n{font-weight:600}
.cd-dots{display:inline-flex;gap:3px;padding-top:5px}
.cd-dots i{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.cd-dots i.on{background:var(--accent)}
.cd-rail-v{min-width:0;overflow-wrap:anywhere}
.country-detail .minibars{margin:6px 0}
.minibars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px}
.minibar{font-size:11px;color:var(--muted);display:grid;gap:3px}
.minibar i{display:block;height:5px;border-radius:3px;background:var(--rule);position:relative;overflow:hidden}
.minibar i::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c)}
.paces{display:flex;flex-wrap:wrap;gap:10px}
.paces .pick{min-width:180px;flex:1}
.options-row{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:8px;padding:9px 12px;width:min(320px,100%)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.start-bar{margin-top:26px;padding-block:20px;border-top:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;gap:10px;align-items:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
.btn.small{padding:8px 14px;font-size:14px}
.note{font-size:12.5px;color:var(--muted);max-width:62ch;margin:0}
.hof{margin-top:4px;display:grid;gap:4px;font-size:13px}
.hof-impact{display:grid;justify-items:end;line-height:1.15}
.hof-impact b{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--l-adopt)}
.impact{display:grid;gap:2px}
.impact b{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,5vw,60px);line-height:1;color:var(--l-adopt)}
.impact span:last-child{color:var(--muted);font-size:14px}
.score.secondary{font-size:13px}
.score.secondary b{font-size:18px}
.hof-head{border-bottom:1.5px solid var(--ink)}
.hof-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule)}

/* ---------- Game ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-block:14px;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--f-display);font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.brand span{color:var(--accent)}
.ctx{display:flex;gap:8px;align-items:center;font-weight:600;min-width:0}
.ctx .flag{font-size:20px}
.when{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.clock b{font-weight:600}
.clock span{color:var(--muted)}
.phase{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:4px;border:1.5px solid currentColor}
.ph-D{color:var(--l-cap)} .ph-B{color:var(--warn)} .ph-S{color:var(--accent)} .ph-E{color:var(--l-pol)}
.board{display:grid;grid-template-columns:290px minmax(0,1fr) 300px;gap:24px;padding-block:22px;align-items:start}
.wrap{max-width:1400px}
@media (max-width:1240px){ .board{grid-template-columns:290px minmax(0,1fr)} .record{grid-column:2} }
.meters{display:grid;gap:14px;align-content:start}
.meter{--c:var(--muted);display:grid;gap:6px}
.m-head{display:flex;align-items:baseline;gap:8px}
.m-dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;align-self:center}
.m-label{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.m-val{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.m-delta{font-family:var(--f-mono);font-size:12px;min-width:34px;text-align:right}
.m-delta.up{color:var(--good)} .m-delta.down{color:var(--bad)}
.m-track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;position:relative}
.m-fill{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:5px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.meter.danger .m-track{box-shadow:0 0 0 2px var(--bad)}
.meter.danger .m-label::after{content:" · critical";color:var(--bad);font-weight:500}
.meters-foot{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px;line-height:1.45}

.card{background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;padding:clamp(20px,3.5vw,36px);display:grid;gap:18px;position:relative;overflow:hidden;min-width:0}
.card-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.cat{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:4px;background:var(--ink);color:var(--bg)}
.meta-l{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.for{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;border:1.5px solid var(--rule);border-radius:999px;padding:3px 10px 3px 6px;background:var(--bg)}
.for-flag{font-size:16px;line-height:1}
.cat.climate{background:var(--l-adopt);color:var(--surface)}
.cat.crisis{background:var(--bad);color:var(--surface)}
.because{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.because b{color:var(--ink);font-weight:600}
.because::before{content:"↳";font-family:var(--f-mono);color:var(--accent);font-weight:600}
.card h2{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,4.6vw,52px);line-height:.98;text-transform:uppercase}
.lede{font-size:clamp(17px,1.6vw,19px);margin:0;max-width:62ch}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--bg);border:1.5px solid var(--rule);border-radius:var(--r);padding:14px 16px;cursor:pointer;font-size:16.5px;font-weight:500;transition:border-color .15s}
.opt:hover{border-color:var(--ink)}
.opt .key{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px}
.risky.ready{color:var(--good)}
.risky.bad{color:var(--bad)}
.risky{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1.5px solid currentColor;border-radius:4px;padding:2px 6px}
.timer{position:absolute;left:0;top:0;height:5px;background:var(--accent);width:100%;animation:drain 45s linear forwards}
.timer.done{background:var(--bad);animation:none;width:100%}
@keyframes drain{to{width:0}}
.timer-label{color:var(--bad)}

.chosen{font-size:14px;color:var(--muted)}
.chosen b{color:var(--ink);font-weight:600}
.gamble{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:4px 9px;border-radius:4px}
.gamble.won{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.gamble.lost{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.deltas{display:flex;flex-wrap:wrap;gap:8px}
.dchip{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--rule);border-radius:999px;padding:5px 12px 5px 8px;font-size:13.5px}
.dchip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.dchip b{font-family:var(--f-mono);font-weight:600}
.dchip.up b{color:var(--good)} .dchip.down b{color:var(--bad)}
.drift{font-size:12.5px;color:var(--muted)}
.lens{border-left:4px solid var(--accent);background:var(--bg);padding:12px 16px;border-radius:0 8px 8px 0;font-size:15px;max-width:70ch}
.lens .eyebrow{color:var(--accent);display:block;margin-bottom:2px}
.foreshadow{font-size:13.5px;color:var(--warn);font-style:italic}
.trophy{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--ink);color:var(--bg);border-radius:12px;padding:16px 18px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.trophy .trophy-cup{width:64px;height:64px;border-width:5px;border-color:var(--l-cash);background:transparent;color:var(--bg);font-size:15px}
.trophy .eyebrow{color:var(--l-cash)}
.trophy b{display:block;font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1.05}
.trophy p{margin:4px 0 2px;font-size:15px;max-width:60ch}
.trophy small{opacity:.7}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
.shelf-btn{cursor:pointer;padding:0;color:var(--ink)}
.shelf-btn.on{background:var(--accent);color:var(--accent-ink)}
.shelf-info{line-height:1.45}
.shelf-info b{color:var(--ink)}
.ms-why{font-size:12.5px;color:var(--muted);max-width:52ch;margin-top:2px}
.ms-banner{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:12px 16px}
.ms-banner .roundel{border-color:var(--accent);background:transparent;color:var(--bg);width:36px;height:36px;font-size:12px}
.ms-banner b{display:block}
.ms-banner small{opacity:.8}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kbd{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* score badge, reach, shelf, record, offers (after the career-simulator format) */
.badge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding-bottom:4px}
.ovr{width:84px;height:84px;border-radius:14px;display:grid;place-items:center;align-content:center;color:#fff;background:var(--tier)}
.ovr .ovr-k{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;opacity:.85}
.ovr b{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:.9}
.ovr.t1{--tier:#8A4B3C}.ovr.t2{--tier:#A8650A}.ovr.t3{--tier:#2C6FAE}.ovr.t4{--tier:#0A7A60}.ovr.t5{--tier:#6A3FB0}
.ovr-side b{display:block;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase}
.reach{border-top:1px solid var(--rule);padding-top:12px;display:grid;gap:6px}
.reach-n{font-family:var(--f-display);font-weight:900;font-size:36px;line-height:1;color:var(--l-adopt)}
.port{display:grid;gap:5px;margin-top:2px}
.port-row{display:grid;grid-template-columns:20px minmax(0,1fr) 60px 52px;gap:8px;align-items:center;font-size:13px}
.port-row.main .port-name{font-weight:600}
.port-row.focus{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:6px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.port-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port-row .flag{font-size:15px}
.port-row .mono{text-align:right;font-size:12px}
.port-bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.port-bar i{display:block;height:100%;background:var(--l-adopt)}
.shelf{border-top:1px solid var(--rule);padding-top:12px;display:grid;gap:8px}
.shelf-row{display:flex;flex-wrap:wrap;gap:6px}
.shelf .roundel{width:38px;height:38px;border-width:3px;font-size:11px}
.record{min-width:0}
.record table{width:100%;border-collapse:collapse;font-size:13px}
.record th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:0 6px 6px}
.record td{padding:7px 6px;border-top:1px solid var(--rule);white-space:nowrap}
.record td.yr{font-family:var(--f-display);font-weight:800;font-size:17px;width:34px}
.record tr.now td{background:var(--surface);color:var(--muted);font-style:italic}
.record tr.now td.yr{color:var(--accent);font-style:normal}
.record tr.empty td{color:var(--rule);height:34px}
.market{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.offer{display:grid;justify-items:center;gap:6px;text-align:center;background:var(--bg);border:1.5px solid var(--rule);border-radius:12px;padding:18px 14px;cursor:pointer;position:relative}
.offer:hover{border-color:var(--ink)}
.offer b{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1}
.offer .offer-flag{font-size:48px;line-height:1.1}
.offer .key{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px}
.offer.stay{border-style:dashed}
.offer .offer-code{width:58px;height:58px;font-size:15px;margin-block:4px}
.record .codes{font-family:var(--f-mono);font-size:11px}
.record .flags{font-size:12px;letter-spacing:1px}

/* line map */
.linemap{padding-block:6px 4px;overflow-x:auto}
.linemap-inner{display:flex;align-items:flex-start;min-width:max-content;padding:20px 6px 4px}
.stn{display:grid;justify-items:center;gap:8px;width:70px;position:relative}
.stn::before{content:"";position:absolute;top:9px;left:-50%;right:50%;height:6px;background:var(--rule);z-index:0}
.stn:first-child::before{display:none}
.stn.done::before,.stn.cur::before{background:var(--accent)}
.stn.slim{width:52px}
.stn .dot{width:24px;height:24px;border-radius:50%;background:var(--surface);border:4px solid var(--rule);position:relative;z-index:1}
.stn.done .dot{border-color:var(--accent);background:var(--accent)}
.stn.cur .dot{border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}
.stn.elec .dot{border-radius:5px;transform:rotate(45deg);width:21px;height:21px}
.stn.fu .dot{border-style:dashed}
.stn .lbl{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:center;line-height:1.25}
.stn .star{position:absolute;top:-18px;font-family:var(--f-mono);font-size:10px;color:var(--accent);font-weight:600;white-space:nowrap}
.stn.gamelost .dot{border-color:var(--bad);background:var(--bad)}

/* end */
.end-hero{display:grid;gap:10px;padding-block:8px}
.rating{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,7vw,86px);line-height:.9;text-transform:uppercase}
.rating.won{color:var(--accent)}
.goal{display:grid;gap:4px}
.goal-bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--l-adopt),var(--accent))}
.hero p.mission{color:var(--ink);font-size:18px;border-left:4px solid var(--accent);padding-left:12px}
.rating.bad{color:var(--bad)}
.score{font-family:var(--f-mono);font-size:15px;color:var(--muted)}
.score b{font-size:28px;color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.ms-list{display:grid;gap:8px}
.ms-item{display:flex;gap:10px;align-items:center;font-size:14px}
.ms-item .roundel{width:32px;height:32px;border-width:3px;font-size:10.5px}
.ms-item.off{opacity:.38}
.journey{display:grid;font-size:14px}
.j-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}
.j-row .mono{font-size:12px;color:var(--muted)}
.j-row b{font-weight:600;display:block}
.j-row span{color:var(--muted)}
.copybox{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:10px}
.section-title{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;margin-bottom:8px}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .board{grid-template-columns:1fr;gap:16px}
  .record{grid-column:auto}
  .badge,.reach,.shelf{grid-column:1/-1}
  .meters{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
  .meters-foot{grid-column:1/-1}
  .two{grid-template-columns:1fr}
  .country-pick{grid-template-columns:1fr}
  .country-detail{position:static;max-height:none;order:-1}
  .when{margin-left:0}
}
@media (max-width:460px){
  .opt{grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px}
  .opt .risky{grid-column:2;justify-self:start}
  .opt .key{width:30px;height:30px;font-size:15px}
  .minibars{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* Flags for what already exists, so the game never offers to build it again. */
function assetFlags(id){
  const d=DPIMAP[id]||{id:[0],pay:[0],dx:[0]}, f=[];
  if(d.id[0]>=2) f.push("hasID"); if(d.pay[0]>=2) f.push("hasPay"); if(d.dx[0]>=2) f.push("hasDX");
  if(WALLETS[id] || (CDPI[id]&&CDPI[id].stage==="DaaS")) f.push("hasWallet");
  if(dpiExisting(id).length) f.push("existingRails");
  return f;
}

function dpiStart(id, stats){

 text:"A coalition of NGOs asks you to assess {block} against the UN Universal DPI Safeguards Framework before launch.",
 opts:[
  {t:"Run a full safeguards assessment and publish it", fx:{cash:-3,trust:11,pol:-2,cap:2}, set:["safeguards"],
   out:"The assessment flags three exclusion risks you had missed. You fix two before launch.",
   lens:"Safeguards cost less at design time than after a scandal: inclusion, privacy, grievance redress and oversight."},
  {t:"Do a privacy impact assessment only", fx:{cash:-1,trust:4},
   out:"Privacy is covered. Inclusion and accountability are not.",
   lens:"Privacy is one safeguard among many. Exclusion is the most common harm in DPI rollouts."},
  {t:"Politely decline. Timelines are tight", fx:{trust:-6,pol:2,cap:1}, then:["fu_safeg",5],
   out:"The NGOs publish their own assessment. It is not flattering.",
   lens:"Skipping engagement rarely saves time. It moves the conversation to the press."}]},

{id:"freepilot", cat:"Procurement", ph:"DB", not:["vendorLock"], title:"A free pilot",
 text:"A global tech company offers to run a {block} pilot in {country} for free for a year. The finance minister is delighted.",
 opts:[
  {t:"Accept the free pilot", fx:{pol:5,adopt:4,cap:-2}, then:["fu_freebill",2],
   out:"The pilot launches in six weeks with a slick app. There is a clause about year two.",
   lens:"Free pilots are rarely free. Check who owns the data, the code and the users when the pilot ends."},
  {t:"Accept only on open standards, with full data return", fx:{eco:4,adopt:2,pol:-2,cap:2}, set:["openStandards"],
   out:"The company hesitates, then agrees to a smaller pilot. You keep the exit door open.",
   lens:"Conditions on standards, data ownership and exit turn a vendor offer into an asset instead of a trap."},
  {t:"Decline", fx:{pol:-3,cap:1},
   out:"The company takes the offer to your neighbour.",
   lens:"Declining avoids lock-in, but you still need a credible way to deliver."}]},

{id:"kickback", cat:"Integrity", ph:"DB", title:"A helpful middleman",
 text:"A well-connected intermediary offers to “speed up” the {block} procurement in exchange for a 3% “facilitation fee”.",
 opts:[
  {t:"Refuse and report it to the anti-corruption office", fx:{trust:6,pol:-4},
   out:"The intermediary is arrested. Some colleagues stop returning your calls.",
   lens:"Open procurement and published contracts are strong anti-corruption tools, and they protect the officials who use them."},
  {t:"Refuse quietly", fx:{cap:1,pol:-1},
   out:"The offer goes away. The procurement stays slow.",
   lens:"Silence protects you today but leaves the system unchanged."},
  {t:"Pay. The project must move", corrupt:true,
   out:"You paid a bribe to speed up the procurement.",
   lens:"Corruption in DPI procurement destroys the trust the infrastructure depends on."}]},

{id:"relative", cat:"Integrity", ph:"DB", title:"A family favour",
 text:"While its {block} bid is being evaluated, a vendor offers your brother-in-law a well-paid “consultancy”.",
 opts:[
  {t:"Declare the conflict of interest and step back from the evaluation", fx:{trust:3,pol:-1},
   out:"The evaluation committee takes over. Your integrity becomes a quiet asset.",
   lens:"Declaring conflicts of interest protects the procurement and the people running it."},
  {t:"Tell your relative to decline, and say nothing", fx:{pol:-1},
   out:"The offer goes away. So does the chance to flag the vendor's behaviour.",
   lens:"Undeclared conflicts can surface later, even when you did the right thing."},
  {t:"It's his business, not yours. Stay on the panel", corrupt:true,
   out:"You kept evaluating a bid while the vendor paid your family.",
   lens:"A conflict of interest in procurement is corruption, whoever receives the money."}]},

{id:"padding", cat:"Integrity", ph:"BS", title:"A little extra",
 text:"A senior politician asks you to add 15% to the next {block} contract, “for the campaign”.",
 opts:[
  {t:"Refuse and report it through the proper channel", fx:{pol:-6,trust:4},
   out:"The request is investigated. You have made a powerful enemy, and kept your name.",
   lens:"Reporting channels and published contracts protect officials who say no."},
  {t:"Refuse politely and keep the contract at its real price", fx:{pol:-3},
   out:"The politician lets it go, for now.",
   lens:"Saying no is the minimum. Integrity systems need people who also report."},
  {t:"Agree. Campaigns are expensive", corrupt:true,
   out:"You inflated a public contract to fund a political campaign.",
   lens:"Diverting public money from DPI contracts is corruption and ends careers."}]},

{id:"adv_gift", role:"adv", self:true, cat:"Integrity", ph:"BS", title:"A generous invitation",
 text:"A vendor bidding for {block} work in {country} offers the CDPI team an all-expenses-paid trip and a speaking fee at its annual conference.",
 opts:[
  {t:"Decline, and tell the ministry about the offer", fx:{trust:2,pol:2,rep:5},
   out:"The ministry notes that CDPI flagged the offer. Your neutrality is confirmed.",
   lens:"CDPI is pro bono and non-commercial. Accepting benefits from vendors would end its neutrality."},
  {t:"Decline quietly", fx:{pol:1,rep:2},
   out:"The vendor moves on.",
   lens:"Declining is right. Telling the client makes it visible."},
  {t:"Accept. It's only a conference", corrupt:true,
   out:"CDPI's advisors accepted paid travel and fees from a vendor bidding for the work they advise on.",
   lens:"An advisor who takes benefits from vendors is no longer neutral."}]},

/* ---------------- Generic: build ---------------- */
{id:"pilot", cat:"Strategy", ph:"B", title:"Where do you pilot?",
 text:"The first release of {block} is ready for real users. Where does it go live first?",
 opts:[
  {t:"The capital, where adoption will be fast", fx:{adopt:5,pol:4,trust:-2},
   out:"Great numbers and good press. Rural leaders ask when their turn will come.",
   lens:"Easy pilots hide problems that appear with low connectivity, low literacy and assisted users."},
  {t:"The district with the lowest coverage", fx:{adopt:2,trust:8,cap:5,pol:-2},
   out:"Hard lessons about offline use and assisted access. The design gets much better.",
   lens:"Designing for the hardest users first makes the system work for everyone."},
  {t:"Nationwide on day one",
   risk:{p:0.4, win:{fx:{adopt:12,pol:8}, out:"Against the odds, it holds. Millions sign up in weeks."},
                lose:{fx:{trust:-11,pol:-10,adopt:2}, then:["fu_recovery",1], out:"Queues, crashes and viral complaints. The launch becomes a meme."}},
   lens:"Scale is earned. Phased rollouts let you fix what breaks while the stakes are low."}]},

{id:"outage", cat:"Technical", ph:"BS", title:"Launch day meltdown",
 text:"Traffic is ten times the forecast. The {block} service is down and the hashtag is trending.",
 opts:[
  {t:"Blame the vendor publicly", fx:{pol:2,eco:-5,trust:-3},
   out:"The vendor lawyers up. Your integrators get nervous about working with you.",
   lens:"Accountability for public infrastructure stays with government, whoever wrote the code."},
  {t:"Publish a status page and a plain-language apology", fx:{trust:6,pol:-4,cap:2},
   out:"Citizens appreciate the honesty. Service is back in 36 hours.",
   lens:"Transparency during incidents builds long-term trust. Plan incident communication before launch."},
  {t:"Take it offline for two months to re-architect", fx:{pol:-6,cash:-5,cap:6,adopt:-2},
   out:"The rebuild is solid. The opposition gets two months of free material.",
   lens:"Load testing and progressive rollouts cost less than rebuilding under pressure."}]},

{id:"cut", role:"gov", cat:"Budget", ph:"BS", title:"Treasury wants 30%",
 text:"Revenues fell short. The finance ministry proposes cutting the {block} budget by 30%.",
 opts:[
  {t:"Accept the cut and slow down", fx:{cash:-16,pol:5,adopt:-1},
   out:"You keep friends in cabinet and lose a year of roadmap.",
   lens:"Recurring funding is a classic DPI failure point. Budget for operations, not just the build."},
  {t:"Show the leakage savings from the rails",
   risk:{p:g=>0.3+g.stats.adopt/100, win:{fx:{cash:6,pol:6}, out:"Your data shows duplicate beneficiaries removed and faster payments. Treasury increases the budget."},
                lose:{fx:{cash:-16,pol:-4}, out:"Adoption is too low to show savings. The cut goes through and you look defensive."}},
   lens:"DPI pays for itself through reduced leakage and faster services, but only once it has users. Measure savings from day one."},
  {t:"Fight it in cabinet", fx:{pol:-11},
   out:"You keep the budget. The finance minister will remember this.",
   lens:"Political capital is finite. Spend it on the fights that matter most."}]},

{id:"surveil", cat:"Political", ph:"BS", title:"“A surveillance machine”",
 text:"The opposition leader calls {block} a surveillance machine. A popular podcast repeats the claim every week.",
 opts:[
  {t:"Publish the architecture and invite independent audits", not:["vendorLock"], fx:{trust:10,cap:2,pol:-2},
   out:"Security researchers review the design and find it minimal and federated. The story dies.",
   lens:"Transparency is a safeguard. Open architectures are easier to defend because anyone can check them."},
  {t:"Ask the vendor for permission to publish the design", req:["vendorLock"], fx:{trust:-3,pol:-3},
   out:"The vendor refuses, citing trade secrets. It looks like you are hiding something.",
   lens:"With a closed system, transparency depends on a company's commercial interests."},
  {t:"Launch a media campaign about the benefits", fx:{pol:5,trust:-2,cash:-4},
   out:"Ads run during the football. Sceptics are not convinced.",
   lens:"Communication helps, but trust comes from verifiable guarantees, not advertising."},
  {t:"Ignore it", fx:{pol:-5,trust:-6},
   out:"Silence reads as guilt.",
   lens:"Trust deficits compound. Address concerns early and specifically."}]},

{id:"union", cat:"Political", ph:"BS", title:"The front desk pushes back",
 text:"Clerks who process paper forms fear {block} will eliminate their jobs. The union threatens a strike.",
 opts:[
  {t:"Retrain them as assisted-access agents", fx:{cash:-6,trust:5,adopt:4,pol:2}, set:["assisted"],
   out:"Former clerks now help citizens use digital services. Queues shrink.",
   lens:"Assisted access is an inclusion safeguard, and front-line staff are the best people to provide it."},
  {t:"Mandate the switch by decree", fx:{pol:-4,adopt:5,trust:-3},
   out:"The switch happens. Service quality at the counters drops for months.",
   lens:"Change management is part of DPI delivery, not an afterthought."},
  {t:"Pause the rollout to negotiate", fx:{pol:-2,adopt:-1,trust:2},
   out:"An agreement is reached after three months.",
   lens:"Negotiation costs time but can turn opponents into allies."}]},

{id:"plugin", cat:"Ecosystem", ph:"BS", not:["secondBlock"], title:"Another ministry wants in",
 text:"The Health and Education ministries ask to reuse {block} for their own services.",
 opts:[
  {t:"Open documented APIs and a sandbox for any agency", fx:{eco:10,adopt:6,cap:-3}, set:["secondBlock"],
   out:"Three services integrate within a quarter. Your support team is swamped.",
   lens:"Reuse is the point of DPI: build the rails once, and many services and sectors run on them."},
  {antiDpi:true, t:"Build custom integrations for each ministry", fx:{eco:3,adopt:3,cash:-8},
   out:"It works, one expensive project at a time.",
   lens:"Point-to-point integrations do not scale. Standards and APIs do."},
  {t:"Not now. Stay focused", fx:{cap:3,pol:-3,eco:-3},
   out:"The ministries start building their own parallel systems.",
   lens:"Refusing reuse invites fragmentation, which is much harder to fix later."}]},

{id:"private", cat:"Ecosystem", ph:"BS", not:["openAccess"], title:"Banks and telcos want access",
 text:"The private sector wants to build services on top of {block}.",
 opts:[
  {privSector:true, t:"Open access for a transaction fee", fx:{cash:12,eco:7,trust:-3},
   out:"Revenue flows. Small startups complain that the fees favour incumbents.",

  {privSector:true, t:"Free access with conformance testing and clear rules", fx:{eco:12,cash:-3,adopt:4,priv:3}, set:["openAccess"],
   out:"Dozens of fintechs and service providers get certified. New services arrive quickly.",
   lens:"Government builds the rails, the market builds the trains. Clear rules and certification keep it safe."},
  {t:"Public sector use only", fx:{trust:3,eco:-10},
   out:"Safe and contained. Also small.",
   lens:"Keeping DPI public-only limits its value. Governance, not exclusion, is how you manage risk."}]},

{id:"divide", cat:"Inclusion", ph:"BS", not:["offline","assisted"], title:"The last 30%",
 text:"A survey shows 30% of adults in {country} have no smartphone and many have limited literacy.",
 opts:[
  {t:"Build a network of assisted-access agents", fx:{cash:-8,adopt:6,trust:5}, set:["assisted"],
   out:"Post offices, pharmacies and community centres become help points.",
   lens:"Multiple channels, including human-assisted ones, keep DPI inclusive."},
  {t:"Add USSD, feature phone and offline QR support", fx:{cash:-5,adopt:5,cap:2}, set:["offline"],
   out:"The rails now work on a $15 phone and on paper.",
   lens:"Offline-first and low-tech channels are inclusion features, not legacy."},
  {t:"Digital-only. The market will catch up", fx:{cash:4,adopt:1,trust:-9},
   out:"Savings on paper. Exclusion in practice.",
   lens:"Digital-only designs exclude the people public services most need to reach."}]},

{id:"pentest", cat:"Security", ph:"BS", not:["bugBounty"], title:"Critical vulnerability",
 text:"An external penetration test finds a flaw in {block} that could expose authentication tokens.",

                lose:{fx:{trust:-16,pol:-6}, out:"A researcher had already found it. The disclosure post goes viral."}},
   lens:"Silent fixes gamble with public trust."},
  {t:"Disclose, patch and launch a bug bounty", fx:{trust:5,pol:-3,cap:5}, set:["bugBounty"],
   out:"The security community starts helping you instead of shaming you.",
   lens:"Coordinated disclosure and bug bounties are standard practice for critical infrastructure."},
  {t:"Freeze new features for a security sprint", fx:{pol:-4,cap:6,adopt:-1},
   out:"The codebase is much safer. The roadmap slips.",
   lens:"Security is a continuous investment, especially for identity and payment rails."}]},

{id:"chatbot", cat:"AI", ph:"BS", not:["aiBlock"], title:"“We need AI!”",
 text:"Back from a tech summit, the President wants an AI assistant on top of {block}, announced in two months.",
 opts:[
  {t:"Connect a general-purpose LLM chatbot straight to citizen data",
   risk:{p:0.5, win:{fx:{pol:10,adopt:4}, then:["fu_chatbot",2], out:"The demo impresses. For now, it answers correctly."},
                lose:{fx:{trust:-15,pol:-5}, out:"The chatbot invents eligibility rules and leaks a record. Screenshots everywhere."}},
   lens:"AI with direct access to core records concentrates risk. Keep AI outside the rails, calling them through governed APIs."},
  {t:"Build scoped AI Blocks (translation, voice, form-filling) as external services", fx:{cash:-6,cap:5,adopt:4,trust:2}, set:["aiBlock"],
   out:"Citizens can use services by voice in their own language. The AI never touches raw records.",
   lens:"CDPI's DPI-AI Framework: AI as external, interoperable capabilities (AI Blocks) that plug into DPI without changing the rails."},
  {t:"Not now. Get the rails right first", fx:{pol:-5,cap:2},
   out:"Sensible, but the President is not happy.",
   lens:"Sequencing matters, but a small, safe AI win can build political support."}]},

{id:"minister", cat:"Political", ph:"BS", title:"A powerful new minister",
 text:"A powerful new minister joins the cabinet and wants a digital flagship of their own, on top of {block}.",
 opts:[
  {t:"Rebrand the program and keep the core", fx:{pol:5,cash:-3},
   out:"New logo, same rails. Everyone is happy.",
   lens:"Letting leaders own the story can protect the infrastructure underneath."},
  {t:"Let them rebuild from scratch", fx:{pol:8,cash:-20,cap:-8,adopt:-5},
   out:"Two years of work are shelved.",
   lens:"Discontinuity is one of the biggest risks to DPI. Institutional anchoring protects continuity."},
  {t:"Brief them with hard data on results",
   risk:{p:g=>0.35+g.stats.adopt/120, win:{fx:{pol:5}, out:"The minister becomes your biggest champion."},
                lose:{fx:{pol:-9}, out:"The minister hears it as resistance. You are on thin ice."}},
   lens:"Evidence of impact is the best protection, if there is enough of it."}]},

/* ---------------- Generic: crises ---------------- */
{id:"ransom", cat:"Crisis", ph:"BS", title:"Ransomware",
 text:"At 3 a.m., ransomware encrypts the servers running {block}. The attackers want $8M in crypto within 72 hours.",
 opts:[
  {t:"Pay the ransom",
   risk:{p:0.5, win:{fx:{cash:-8,trust:-4}, out:"You get a working key. The payment leaks to the press a month later."},
                lose:{fx:{cash:-8,trust:-10,adopt:-3}, out:"You pay. The key only half works, and the data is sold anyway."}},
   lens:"Paying funds the next attack and guarantees nothing. Tested offline backups decide how these stories end."},
  {t:"Refuse and restore from backups",
   risk:{p:g=>(has(g,"cloudAgnostic")?0.35:0)+(has(g,"bugBounty")?0.1:0)+g.stats.cap/140,
         win:{fx:{trust:6,cap:3}, out:"The offline backups work. Services are back in 30 hours, and the attackers get nothing."},
         lose:{fx:{adopt:-4,trust:-8,pol:-4}, out:"The backups sat on the same network. Recovery takes three weeks."}},
   lens:"Incident playbooks, isolated backups and regular restore drills are part of operating critical infrastructure."},
  {t:"Shut everything down and rebuild clean", fx:{cash:-12,adopt:-3,cap:5,pol:-3},
   out:"Two weeks offline. The new environment is much harder to break.",
   lens:"Sometimes the safest recovery is a clean rebuild, if you can afford the downtime."}]},

{id:"pandemic", cat:"Crisis", ph:"BS", title:"Lockdown",
 text:"A new pandemic forces a national lockdown. Five million informal workers need emergency cash within two weeks.",

   risk:{p:g=>0.15+g.stats.adopt/80+g.stats.cap/300,

         lose:{fx:{trust:-6,pol:-6}, out:"Too few people are on the rails yet. Payments reach only a fraction of those in need."}},
   lens:"DPI shows its value most in a crisis. Countries with ID, payments and registries in place delivered emergency support in days."},
  {t:"Partner with mobile money operators and banks", fx:{cash:-6,adopt:5,eco:6,pol:3},
   out:"Private channels deliver, using your verification. It works, at a cost.",
   lens:"Public rails and private providers together reach further than either alone."},
  {t:"Paper vouchers through local officials", fx:{pol:-2,trust:-4,cash:-5},
   out:"Slow, with leakage. Queues become infection hotspots.",
   lens:"Analogue emergency programs are slower and leak more."}]},

{id:"quake", cat:"Crisis", ph:"BS", title:"Earthquake",
 text:"A major earthquake hits the south of {country}. Paper records in six municipalities are destroyed and 300,000 people need help.",
 opts:[
  {delivery:true, t:"Verify people from digital records and pay by phone",
   risk:{p:g=>0.2+g.stats.adopt/70,
         win:{fx:{pol:7,trust:5,adopt:4}, out:"Families prove who they are without a single document. Help arrives within days."},
         lose:{fx:{pol:-4,trust:-3}, out:"Most victims were never in the digital records. The system cannot help them."}},
   lens:"Digital records that survive disasters make relief faster and fairer."},
  {t:"Send mobile registration teams with offline kits", fx:{cash:-8,trust:6,adopt:4}, set:["offline"],
   out:"Teams register families in camps. The kits become standard equipment.",
   lens:"Offline-capable tools matter most when the network is down."},
  {t:"Wait for paper records to be rebuilt", fx:{pol:-6,trust:-4},
   out:"Weeks pass. People queue in the rain for certificates.",
   lens:"Paper-only systems fail when they are needed most."}]},

{id:"deepfake", cat:"Crisis", ph:"BS", title:"Deepfake",
 text:"A deepfake video shows the Minister saying {block} will be used to freeze people's savings. It has five million views.",

  {t:"Rapid factual response, with signed and verifiable official statements", fx:{trust:4,pol:-1,cap:2},
   out:"The fake is debunked within hours. The signed statement becomes a model for future communication.",
   lens:"Trust needs a communication plan. Content provenance and quick, factual responses limit disinformation."},
  {t:"Ask platforms to take it down and prosecute the creators", fx:{pol:3,trust:-3},
   out:"The takedowns fuel the conspiracy theory.",
   lens:"Heavy-handed responses can look like confirmation."},
  {t:"Say nothing", fx:{trust:-7,adopt:-2},
   out:"Enrolment drops in three provinces.",
   lens:"Silence leaves the story to others."}]},

   out:"Headlines at home and abroad.",
   lens:"International visibility can protect a program politically at home."},
  {t:"Contribute your improvements back to the DPG community", any:["openSource"], fx:{eco:8,cap:3,trust:3}, set:["contributor"],
   out:"Other countries adopt your extensions. Your engineers become global reference points.",
   lens:"Countries that contribute back to DPGs shape their roadmaps and strengthen South-South cooperation."},
  {t:"Offer peer learning to other countries", fx:{eco:4,pol:3,cap:1},
   out:"Three delegations visit next quarter.",
   lens:"Country-to-country learning is one of the fastest ways DPI spreads."},
  {t:"Decline and stay focused at home", fx:{cap:1,pol:-2,eco:-2},
   out:"Quiet progress.",
   lens:"Focus is fine, but visibility attracts partners and funding."}]},

/* ---------------- Partners, DPGs and global stage ---------------- */
{id:"mdb_ta", cat:"Partners", ph:"D", title:"Technical assistance on offer",
 text:"The World Bank offers to fund a DPI readiness assessment for {country} and embed two advisors in your team for a year.",
 opts:[
  {t:"Accept, with your team leading the work", fx:{cap:6,pol:3,trust:2},
   out:"The assessment maps gaps in law, capacity and systems. Your team owns the roadmap.",
   lens:"Partner expertise lands best when the government sets the agenda and keeps ownership."},
  {t:"Accept and ask the advisors to draft the strategy", fx:{cap:3,pol:3},
   out:"A strong strategy arrives quickly. Your team now has to make it its own.",
   lens:"Expert drafting saves time. Ownership comes from the national team shaping and defending the plan."},
  {t:"Decline for now", fx:{cap:-1},
   out:"You save a few weeks and miss a strong partner for later.",
   lens:"Early partnerships open doors to financing and peer learning."}]},

{id:"fiftyin5", cat:"Partners", ph:"DB", not:["fiftyIn5"], title:"The 50-in-5 campaign",
 text:"The 50-in-5 campaign, backed by partners including UNDP, the Digital Public Goods Alliance, the Gates Foundation and CDPI, invites {country} to commit to launching safe, inclusive DPI within five years.",
 opts:[
  {t:"Join publicly, with the President announcing it", fx:{pol:5,eco:5,trust:2}, set:["fiftyIn5"],
   out:"{country} joins a cohort of countries sharing playbooks and lessons.",
   lens:"Peer cohorts speed up learning: you see what worked, and what failed, in countries like yours."},
  {t:"Join quietly at the technical level", fx:{cap:4,eco:3}, set:["fiftyIn5"],
   out:"Your architects join working groups and bring back templates.",
   lens:"Technical communities of practice are often where the real knowledge transfer happens."},
  {t:"Stay out. Commitments can backfire", fx:{pol:1,eco:-2},
   out:"No public promise to break. No cohort either.",
   lens:"Public commitments create pressure to deliver, which can help or hurt."}]},

{id:"undp", cat:"Partners", ph:"DB", title:"A national conversation",
 text:"UNDP offers to support a national DPI safeguards dialogue and a citizen consultation on {usecase}.",
 opts:[
  {t:"Consult in every region, in local languages", fx:{trust:9,pol:2,cash:-2,adopt:2}, set:["safeguards"],
   out:"Thousands of people take part. The design changes in three important ways.",
   lens:"Participation is a safeguard. People trust systems they helped shape."},
  {t:"Start with a national workshop in the capital", fx:{trust:4,pol:2},
   out:"A useful start, though rural voices are still missing.",
   lens:"Consultation works best when it reaches the people most at risk of exclusion."},
  {t:"Not now", fx:{trust:-3},
   out:"Civil society notes the missed opportunity.",
   lens:"Declining engagement sends a signal of its own."}]},

{id:"gates", role:"gov", cat:"Partners", ph:"DB", title:"A foundation grant",
 text:"The Gates Foundation offers a grant for inclusive {usecase} on the rails, supporting open-source software and measuring women's inclusion.",
 opts:[
  {t:"Accept and publish the inclusion data", fx:{cash:15,trust:5,eco:3,pol:2}, set:["openSource","genderData"],
   out:"Funding arrives. The data reveals a large gender gap, and now you know where to act.",
   lens:"Measuring inclusion by gender, age and location shows who the rails are missing."},
  {t:"Accept, and keep the inclusion data internal for now", fx:{cash:15,pol:2,trust:-1}, set:["openSource"],
   out:"The funds help. Without published data, the gaps are harder to close.",
   lens:"Being open about who is excluded is uncomfortable, and it is how gaps get closed."},
  {t:"Decline for now", fx:{eco:-2},
   out:"You keep a smaller budget.",
   lens:"Open-source and inclusion commitments usually match a country's long-term interest."}]},

{id:"dpg_pick", build:true, cat:"DPG", ph:"D", not:["openSource","vendorLock"], title:"Which Digital Public Good?",
 text:"Your architects shortlist Digital Public Goods for {block}. One is mature with a large community, one is newer but fits {usecase} better, and a local firm proposes forking one heavily.",
 opts:[
  {t:"The mature DPG with a large community ({dpg})", fx:{cap:5,eco:5,cash:-3}, set:["openSource"],
   out:"Plenty of implementers and documentation. Some features need configuration work.",
   lens:"Community size, governance and the implementer ecosystem matter as much as features."},
  {t:"The newer DPG that fits better",
   risk:{p:0.55, win:{fx:{cap:6,adopt:4}, set:["openSource"], out:"It fits well, and your feedback shapes its roadmap."},
                 lose:{fx:{cap:-3,cash:-8}, set:["openSource"], out:"The maintainers lose their funding. You inherit the code."}},
   lens:"Check a DPG's sustainability: funding, maintainers and other adopters."},
  {antiDpi:true, t:"Fork one and customise it heavily", fx:{adopt:4,cap:-2,eco:-4}, set:["openSource","forked"],
   out:"Exactly what you wanted today. Every upstream update is now a migration project.",
   lens:"Heavy forks lose the main benefit of DPGs, shared maintenance. Configure and extend instead."}]},

{id:"dpga", cat:"DPG", ph:"S", any:["openSource","contributor"], not:["dpgRegistered"], title:"Your own Digital Public Good",
 text:"Your team has built useful extensions to {dpg}. The Digital Public Goods Alliance could list them as a DPG if they meet the DPG Standard.",
 opts:[
  {t:"Meet the DPG Standard and apply", fx:{cash:-3,eco:8,cap:3,pol:3}, set:["dpgRegistered"],
   out:"Your module is recognised as a Digital Public Good. Two other countries start using it.",
   lens:"The DPG Standard checks open licensing, documentation, privacy and do-no-harm. Contributing back multiplies impact."},
  {t:"Keep it in-house", fx:{eco:-3},
   out:"It works for you, and for no one else.",
   lens:"Unshared improvements get rebuilt, at cost, by the next country."}]},

{id:"bootcamp", cat:"Orchestration", ph:"BS", not:["bootcamp"], title:"A scale-up bootcamp",
 text:"CDPI proposes a bootcamp for {block}: a few intensive days to onboard the first wave of verifiers and service providers for {usecase}.",
 opts:[
  {privSector:true, t:"Run it with banks, hospitals and agencies in the room", fx:{adopt:5,eco:6,pol:3}, set:["bootcamp"],
   out:"A dozen verifiers go live in a week. People can finally use their credentials somewhere.",
   lens:"Issuing credentials is half the job. Adoption depends on verifiers and real use cases."},
  {t:"Run it for the government technical team", fx:{cap:6,adopt:2}, set:["bootcamp"],
   out:"Your team ships faster, but few services accept the credentials yet.",
   lens:"Bootcamps work best when the whole ecosystem is in the room."},
  {t:"Not now", fx:{cap:-1},
   out:"The backlog of verifiers keeps growing.",
   lens:"Without verifiers, credentials stay unused."}]},

{id:"daas", build:true, cat:"Orchestration", ph:"D", not:["daas","bootcamp","cdpiLive"], title:"How do you go live?",
 text:"CDPI does not build; it sequences, convenes and guides, pro bono and with no preferred technology. It offers three ways to get {block} live for {usecase}.",
 opts:[
  {t:"A CDPI bootcamp: one intensive week to issue the first live credentials", fx:{adopt:4,pol:5,cap:3}, set:["bootcamp","quickWin"],
   out:"Government, DPG teams and the first verifiers work side by side. The first credentials are live by day seven.",
   lens:"In Colombia, a CDPI bootcamp compressed eight months of technical work into seven days, followed by about 45 days of fine-tuning before citizen access."},
  {t:"DaaS, DPI as a packaged solution: ready kits that upgrade existing systems, owned by the country", fx:{adopt:5,cap:5,pol:3,cash:-3}, set:["daas","openSource"], then:["fu_daas",3],
   out:"Pre-packaged kits for authentication, credentials and an ID account mapper arrive with open-source artefacts and trained service providers. They run on your own infrastructure.",
   lens:"DaaS deploys minimalist DPI blocks mainly by upgrading existing infrastructure rather than building greenfield, often within existing procurement frameworks, and at population scale from day one. In Peru it reached national ID credentials at scale in about six months."},
  {t:"Do it yourselves, with CDPI's advisory", fx:{cap:5,pol:-4,cash:-4},
   out:"Your team designs and builds with CDPI's technical reviews along the way. Progress is slower, and the skills stay in-house.",
   lens:"The advisory-only path typically takes around a year and a half, and builds deep national capacity."}]},

{id:"unicef", cat:"Partners", ph:"DB", not:["childSafe"], title:"Designing for children",
 text:"UNICEF offers support to make {block} child-safe and to link it with birth registration, so every child in {country} is counted from day one.",
 opts:[
  {t:"Adopt child-safe design guidance and link birth registration", fx:{trust:7,adopt:5,pol:3,cash:-3}, set:["childSafe"],
   out:"Newborns are registered at health facilities, and children's data gets extra protection.",
   lens:"Children are DPI users from birth. Child-safe design, with no children's biometrics and strict data minimisation, protects them for life."},
  {t:"Start with a joint pilot in two provinces", fx:{trust:4,adopt:2,pol:2,cap:2}, set:["childSafe"],
   out:"The pilot shows how to reach mothers at clinics and schools. Scale-up plans follow.",
   lens:"Pilots with specialised partners build the evidence to scale."},
  {t:"Focus on adults first", fx:{cap:1},
   out:"Children stay invisible to the system for now.",
   lens:"Identity and service gaps in childhood become exclusion in adulthood."}]},

{id:"un_team", cat:"Partners", ph:"BS", title:"A joint UN offer",
 text:"The UN Resident Coordinator proposes a joint UN programme for {usecase} on the rails, bringing several UN agencies behind the government's plan.",
 opts:[
  {t:"Accept, with one joint workplan led by government", fx:{pol:4,cap:4,trust:4,cash:5},
   out:"Agencies line up behind a single plan. Duplicate pilots disappear.",
   lens:"Partner support behind one government-led plan avoids fragmentation."},
  {t:"Accept, focused on safeguards and inclusion", fx:{trust:7,pol:2,adopt:2}, set:["safeguards"],
   out:"UN support helps design grievance channels and reach excluded groups.",
   lens:"Rights-based expertise from the UN system strengthens safeguards where they matter most."},
  {t:"Keep working with each agency separately", fx:{pol:1,cap:-1},
   out:"Several parallel projects continue, each with its own reporting.",
   lens:"Without one government-led plan, even good partner projects can overlap."}]},

{id:"g20_frame", cat:"Partners", ph:"DB", title:"The G20 DPI framework",
 text:"Your team reviews the G20 framework for DPI, which sets out shared principles for safe, inclusive and interoperable systems.",
 opts:[
  {t:"Build its principles into the national DPI strategy", fx:{trust:5,eco:4,pol:3}, set:["openStandards"],
   out:"Ministries now share one vocabulary and one checklist.",
   lens:"International frameworks give countries tested principles and a common language with partners."},
  {t:"Use it to brief Parliament and build cross-party support", fx:{pol:5,trust:3},
   out:"Opposition members recognise the principles and support the approach.",
   lens:"External reference points help take DPI out of partisan debate."},
  {t:"Note it and move on", fx:{cap:1},
   out:"The document sits in a shared folder.",
   lens:"Frameworks help most when they shape actual decisions."}]},

{id:"g20", cat:"Partners", ph:"BS", not:["g20"], title:"Invited to the G20",
 text:"{country} is invited to speak about DPI at a G20 ministerial meeting.",
 opts:[
  {t:"Share honest lessons, including failures", fx:{eco:5,trust:3,pol:2}, set:["g20"],
   out:"Other ministers seek you out afterwards. Two peer learning visits are agreed.",
   lens:"Candid lessons are the most valuable thing a country can share."},
  {t:"Announce an ambitious national target", fx:{pol:7,eco:2}, set:["g20"], then:["fu_target",3],
   out:"Headlines at home: “{country} will reach 80% adoption in three years.”",
   lens:"Public targets mobilise support, and create a deadline you must meet."},
  {t:"Send a junior official", fx:{cap:1,pol:-1}, set:["g20"],
   out:"The slot passes without notice.",
   lens:"Visibility can bring partners and funding."}]},

{id:"davos", cat:"Partners", ph:"BS", not:["davos"], title:"Davos",
 text:"The World Economic Forum invites {country} to a Davos session on DPI with investors, companies and other governments.",
 opts:[
  {privSector:true, t:"Showcase the rails and invite investors into the local ecosystem", fx:{eco:7,pol:4}, set:["davos"],
   out:"Three funds commit to local startups building on your rails.",
   lens:"DPI creates markets. Investors who understand that can help an ecosystem grow."},
  {t:"Use the meetings to set up peer learning with other governments", fx:{cap:4,eco:3,pol:3}, set:["davos"],
   out:"Two ministers agree to exchange teams next quarter.",
   lens:"Global forums are a fast way to find peers who solved your next problem."},
  {t:"Sign a quick AI deal with a tech company you met there", fx:{pol:5,adopt:3,trust:-6}, set:["davos","vendorLock"],
   out:"Great photos. Back home, the data clauses in the deal draw criticism.",
   lens:"Deals made quickly deserve the same scrutiny as any procurement: open standards, data protection and exit clauses."}]},

{id:"t_lang", cat:"AI", ph:"DB", trait:["multilingual"], not:["aiBlock"], title:"Dozens of languages",
 text:"Half the people who need {usecase} in {country} do not read the official language well.",
 opts:[
  {t:"Build open speech and translation AI Blocks with local universities", fx:{cash:-8,adopt:6,trust:4,eco:3}, set:["aiBlock"],
   out:"People can now speak to services in their own language.",
   lens:"Foundational AI Blocks like translation and speech-to-text make every service accessible."},
  {t:"Printed guides in the main languages", fx:{cash:-3,adopt:2},
   out:"Helpful for those who can read.",
   lens:"Low-tech fixes help, but voice reaches people who cannot read."},
  {t:"Official language only", fx:{trust:-4},
   out:"Community leaders call it exclusion.",
   lens:"Language exclusion is exclusion."}]},

{id:"ai_integrate", cat:"AI", ph:"BS", minBlocks:2, not:["workflows"], title:"Make the rails work together",
 text:"{country} now runs {rails}. People still have to visit each one separately for {usecase}.",
 opts:[
  {t:"Orchestrate them with DPI Workflows, with AI Blocks filling forms, translating and routing cases", fx:{adopt:7,eco:5,cap:3,cash:-6,pol:2}, set:["workflows","aiBlock"],
   out:"One conversation, in any language, now checks identity, eligibility and payment in a single journey.",
   lens:"DPI is an approach built from interoperable blocks. AI is the integration layer: AI Blocks inside government-owned DPI Workflows turn separate rails into one service."},
  {antiDpi:true, t:"Build point-to-point integrations between each pair of systems", fx:{cash:-12,adopt:3,cap:-2},
   out:"It works, and every new block multiplies the integrations to maintain.",
   lens:"Point-to-point integration grows quadratically with every new block."},
  {t:"Keep them separate for now", fx:{pol:-2},
   out:"People keep repeating the same information to each rail.",
   lens:"Blocks create value when they compose."}]},

/* ---------------- Public AI agents (any rail) ---------------- */
{id:"agent_channels", cat:"AI", ph:"BS", title:"Where does the agent live?",
 text:"Your team is designing a public AI agent to guide people through {usecase}. Which channels will it use?",
 opts:[
  {t:"A smartphone app and WhatsApp", fx:{adopt:4,trust:-6,cash:-3}, set:["aiAgents"],
   out:"Fast growth in cities. Most rural users cannot reach it.",
   lens:"Smartphone-only channels exclude a large share of people in most countries."},
  {t:"Voice over any phone, plus SMS and USSD", fx:{adopt:7,cash:-6,cap:2}, set:["aiAgents","offline"],
   out:"Anyone with a basic phone can talk to the agent in their language.",
   lens:"Voice and USSD reach people with basic phones and low literacy."},
  {t:"In person, with an agent copilot for front-line staff", fx:{adopt:4,trust:6,cash:-4}, set:["aiAgents","assisted"],
   out:"Staff at service centres use the agent to help people faster.",
   lens:"Assisted channels, where AI supports a human, are often the most inclusive option."}]},

{id:"agent_escalate", cat:"AI", ph:"BS", req:["aiAgents"], not:["humanLoop"], title:"When the agent is unsure",
 text:"In testing, your public agent is uncertain in 12% of {usecase} cases. What should it do?",
 opts:[
  {t:"Escalate to a human caseworker with a case summary", fx:{cash:-5,trust:7,adopt:2}, set:["humanLoop"],
   out:"Caseworkers handle the hard cases. Citizens get answers, not guesses.",
   lens:"Clear escalation paths are a core safeguard for public agents: uncertainty goes to a human."},
  {t:"Give its best guess",
   risk:{p:0.45, win:{fx:{adopt:6}, out:"Most guesses are right, and people get fast answers."},
                 lose:{fx:{trust:-12,pol:-3}, out:"Wrong guesses cost people their benefits. A radio show collects the stories."}},
   lens:"Guessing on rights and entitlements pushes the cost of errors onto citizens."},
  {t:"Refuse and send people to an office", fx:{trust:-2,adopt:-1},
   out:"Safe, but frustrating.",
   lens:"A refusal with no helpful next step still fails people."}]},

{id:"agent_model", cat:"AI", ph:"BS", req:["aiAgents"], title:"Which model powers the agent?",
 text:"The public agent for {usecase} needs a language model. The team presents three options.",
 opts:[
  {t:"A frontier model through a commercial API", fx:{adopt:5,cap:1,trust:-5,cash:-8},
   out:"Excellent quality. The bill grows with every conversation, and data crosses borders.",
   lens:"Frontier APIs offer quality. Contract terms on data retention, residency and pricing matter."},
  {t:"An open-weight model hosted in-country", fx:{cap:5,trust:4,cash:-8,adopt:2},
   out:"Slightly less fluent, fully under your control.",
   lens:"Open-weight models give sovereignty and predictable costs, with more work to run them."},
  {t:"Model-agnostic: a gateway so models can be swapped", fx:{cap:4,eco:3,cash:-4}, set:["cloudAgnostic"],
   out:"You can switch models as prices and quality change.",
   lens:"Treat the model as a replaceable AI Block behind a standard interface, not the core of the system."}]},

{id:"agent_safeguard", cat:"AI", ph:"S", req:["aiAgents"], not:["aiSafeguards"], title:"Safeguard blocks for agents",
 text:"Public agents now handle thousands of {usecase} cases a day. The oversight board asks what protects people from bad decisions.",
 opts:[
  {t:"Add bias checks, consent verification and human review blocks to every workflow", fx:{cash:-6,trust:9,cap:3}, set:["aiSafeguards","humanLoop"],
   out:"Every workflow now has checkpoints. Error rates and complaints fall.",
   lens:"Safeguard AI Blocks (bias check, consent verification, human review) belong inside the workflow, not only in a policy document."},
  {t:"Publish monthly audit reports", fx:{trust:3,cash:-2},
   out:"Transparency helps, but problems surface after the harm is done.",
   lens:"Audits are necessary, and they come after the fact."},
  {t:"The vendor says the model is safe", fx:{trust:-6},
   out:"The board is not reassured.",
   lens:"Assurance must be verifiable by government, not only asserted by vendors."}]},

{id:"agent_delegate", cat:"AI", ph:"S", title:"Agents acting for citizens",
 text:"Private AI assistants want to apply for services on behalf of their users through your {block} APIs.",
 opts:[
  {privSector:true, t:"Allow it with delegated consent and scoped, revocable tokens", fx:{eco:8,adopt:5,cap:-2}, set:["secondBlock"],
   out:"People can authorise an assistant to act for them on specific tasks, and revoke it at any time.",
   lens:"Delegated, scoped and revocable consent lets agents act for people safely."},
  {t:"Block all automated access", fx:{trust:2,eco:-8},
   out:"Assistants start scraping the web portal instead.",
   lens:"Blocking legitimate agents pushes them to unsafe workarounds."},
  {t:"Allow it freely", fx:{eco:6,trust:-8},
   out:"A wave of fraudulent applications follows.",
   lens:"Agent access without identity, consent and limits invites abuse."}]},

/* ---------------- Use cases ---------------- */
{id:"uc_g2p", uc:["g2p"], cat:"Crisis", ph:"BS", title:"Food prices spike",
 text:"Food prices rise 40%. Cabinet wants to top up social transfers for the poorest families next month.",
 opts:[
  {delivery:true, t:"Target through the registry and pay on the rails",
   risk:{p:g=>0.25+g.stats.adopt/90, win:{fx:{pol:7,trust:4,adopt:4}, out:"Top-ups reach two million families within three weeks."},
                lose:{fx:{pol:-4,trust:-4}, out:"The registry is too incomplete. Many poor families are missed."}},
   lens:"Dynamic registries plus interoperable payments make shock-responsive social protection possible."},
  {t:"Digital food vouchers as verifiable credentials, redeemable at local shops", fx:{adopt:4,trust:4,eco:4,cash:-6,pol:3}, ensureBlock:"vc",
   out:"Families receive vouchers in their wallet or as a paper QR code. Local shops verify and redeem them instantly, even offline.",
   lens:"Verifiable credentials can carry entitlements such as food vouchers: targeted, tamper-proof and redeemable offline."},
  {t:"A flat payment to every adult", fx:{cash:-15,pol:5,adopt:4},
   out:"Fast and simple, and expensive.",
   lens:"Universal payments trade targeting accuracy for speed."},
  {t:"Food distribution through local officials", fx:{pol:-2,trust:-3,cash:-6},
   out:"Slow, with reports of favouritism.",
   lens:"Discretionary in-kind distribution is hard to audit."}]},

{id:"uc_health", uc:["health"], cat:"Safeguards", ph:"BS", title:"Who holds the health record?",
 text:"Hospitals want a national health record system. Patients' groups want control over who sees their data.",
 opts:[
  {t:"Patient-controlled records shared by consent, on the FHIR standard", fx:{trust:8,eco:5,cash:-6}, set:["consentBuilt","openStandards"],
   out:"Patients approve which clinic sees what. Doctors get records in seconds.",
   lens:"Consent-based health data exchange on open standards like FHIR balances care and privacy."},
  {antiDpi:true, t:"A central national health database", fx:{cap:3,trust:-7,adopt:5},
   out:"Easy analytics, and a very attractive target for attackers.",
   lens:"Centralised health data is a high-value target and a privacy risk."},
  {antiDpi:true, t:"Each hospital keeps its own system", fx:{eco:-4},
   out:"Patients keep carrying paper folders.",
   lens:"Without interoperability, patients become the data exchange."}]},

{id:"uc_agri", uc:["agri"], cat:"AI", ph:"BS", title:"Advice for farmers",
 text:"An AI voice agent could give farmers weather, pest and price advice in their language, linked to the farmer registry.",
 opts:[
  {t:"Launch with agronomists reviewing the advice", fx:{adopt:7,trust:4,cash:-5}, set:["aiBlock","aiAgents","humanLoop"],
   out:"Farmers call the agent daily. Yields improve in the pilot districts.",
   lens:"Sector-specific AI Blocks need domain experts to validate their outputs."},
  {t:"Let the model advise freely",
   risk:{p:0.5, win:{fx:{adopt:8}, set:["aiBlock","aiAgents"], out:"Farmers love it."},
                lose:{fx:{trust:-10}, out:"The agent recommends the wrong pesticide. Crops fail in two districts."}},
   lens:"Unverified AI advice can cause real-world harm."},
  {t:"Stick to SMS alerts", fx:{adopt:3,cash:-1},
   out:"Useful, and limited.",
   lens:"Simple tools work. Governed AI can add a lot on top."}]},

{id:"uc_edu", uc:["edu"], cat:"Ecosystem", ph:"BS", title:"From diploma to job",
 text:"Employers and job platforms want to verify skills and diplomas instantly.",
 opts:[
  {t:"Verifiable skills credentials that people control", fx:{eco:8,adopt:5,trust:3}, set:["openStandards"],
   out:"Graduates share credentials with employers in one tap.",
   lens:"Portable, verifiable credentials help people prove what they know."},
  {antiDpi:true, t:"Let employers query the education database directly", fx:{eco:5,trust:-7},
   out:"Employers see far more than grades.",
   lens:"Direct database access breaks data minimisation."},
  {t:"Keep paper certificates", fx:{eco:-3},
   out:"Fraud and delays continue.",
   lens:"Paper verification is slow and easy to fake."}]},

{id:"uc_credit", uc:["credit"], cat:"Ecosystem", ph:"BS", title:"Credit for small businesses",
 text:"Lenders want to offer loans to small businesses based on their payment and tax history.",
 opts:[
  {privSector:true, t:"Consent-based cash-flow lending", fx:{eco:9,adopt:6,trust:3}, set:["consentBuilt"],
   out:"Micro-businesses get their first formal loans in minutes.",
   lens:"Consented data sharing turns transaction history into collateral."},
  {antiDpi:true, t:"Give lenders bulk access to the data", fx:{eco:6,trust:-9},
   out:"Aggressive lending apps multiply.",
   lens:"Bulk access without consent fuels predatory lending."},
  {t:"Leave credit to the banks", fx:{eco:-2},
   out:"Nothing changes for small businesses.",
   lens:"DPI widens access to finance when data flows with consent."}]},

{id:"uc_crvs", uc:["crvs"], cat:"Inclusion", ph:"BS", title:"Registering every birth",
 text:"Many births in {country} happen at home, far from any registration office.",
 opts:[
  {t:"Community health workers register births on a mobile app", fx:{adopt:8,trust:4,cash:-5}, set:["offline"],
   out:"Birth registration rates climb every quarter.",
   lens:"Bringing registration to where births happen is the fastest way to close the gap."},
  {t:"Fines for late registration", fx:{adopt:2,trust:-6},
   out:"Poor families avoid registering altogether.",
   lens:"Penalties deter the families you most need to reach."},
  {t:"A national registration week once a year", fx:{adopt:4,cash:-4},
   out:"Long queues, one week a year.",
   lens:"Continuous registration beats campaigns."}]},

/* ---------------- CDPI advisor only: your own conduct (applied directly, no government vote) ---------------- */
{id:"adv_mdb", role:"adv", self:true, cat:"Partners", ph:"B", not:["mdbProject"], title:"A development bank project",
 text:"The government of {country} and the World Bank are preparing a new DPI operation covering {block}. Whether to borrow is the government's decision, not CDPI's. The government goes ahead. CDPI can help the technical design follow DPI principles.",
 opts:[
  {t:"Share CDPI's technical scope and open artefacts with the project team", fx:{cash:30,cap:4,eco:4,pol:2}, set:["mdbProject","openStandards"],
   out:"The project design adopts open standards, modular building blocks and clear exit clauses from the start.",
   lens:"CDPI never advises on borrowing. It helps make sure that whatever gets financed is open, interoperable and free of lock-in."},
  {t:"Review the draft procurement documents for vendor, cloud and data lock-in", fx:{cash:30,cap:3,trust:2,pol:1}, set:["mdbProject"],
   out:"Your review removes two clauses that would have tied the country to a single vendor.",
   lens:"Avoidable design errors (vendor, cloud and data lock-in) are cheapest to fix before procurement."},
  {t:"Stay out of it entirely", fx:{cash:30,pol:-2}, set:["mdbProject","vendorLock"],
   out:"The project goes ahead with a generic design. A lock-in clause slips through.",
   lens:"Staying neutral on financing does not mean staying out of the technical design."}]},

{id:"adv_mdb_scale", role:"adv", self:true, cat:"Partners", ph:"S", not:["mdbScale"], title:"Scaling with the {mdb}",
 text:"The {mdb} and the government of {country} agree a new operation to scale {block} nationwide. The financing is theirs to decide. They ask CDPI how its artefacts could be reused in the project.",
 opts:[
  {t:"Embed CDPI's reusable artefacts in the project design", fx:{cash:40,eco:5,cap:3,pol:3}, set:["mdbScale"],
   out:"CDPI's technical scope becomes part of the operation, and other countries in the region can reuse it.",
   lens:"Embedding reusable DPI artefacts in development bank projects multiplies their reach, without CDPI ever advising on the loan itself."},
  {t:"Offer a bootcamp to get the first new services live quickly", fx:{cash:40,adopt:4,pol:3}, set:["mdbScale"],
   out:"New services go live within weeks of the project starting.",
   lens:"Fast, visible delivery helps large projects keep momentum."}]},

{id:"adv_endorse", role:"adv", self:true, cat:"Advisor", ph:"DB", title:"“Say we're CDPI-recommended”",
 text:"A vendor bidding for {block} in {country} asks you to co-present at its launch event and describe its product as CDPI-recommended.",
 opts:[
  {t:"Decline, and publish a neutral evaluation framework anyone can use", fx:{rep:7,trust:3,eco:4,pol:1},
   out:"The vendor is annoyed. The ministry uses your framework to compare every bid, and other governments ask for it too.",
   lens:"CDPI is tech-neutral. Its value to a country depends on never being seen as selling a product."},
  {t:"Co-present. They are probably the best option anyway", fx:{pol:3,trust:-6,eco:-4}, set:["advBiased"],
   out:"Competing bidders complain to the minister that the advisor is not neutral.",
   lens:"Once an advisor is seen as picking winners, every later recommendation is questioned."},
  {t:"Ignore the email", fx:{rep:-1},
   out:"The vendor tells the ministry you are “supportive”. You find out later.",
   lens:"Neutrality needs to be stated clearly, not assumed."}]},

{id:"adv_rfp", role:"adv", self:true, cat:"Advisor", ph:"D", title:"“Just write the tender for us”",
 text:"The minister asks your team to write the {block} tender, and to name the product you think should win.",
 opts:[
  {t:"Help define outcomes, open standards and exit clauses, never products", fx:{cap:5,eco:4,pol:1,rep:4}, set:["openStandards"],
   out:"The tender is short, outcome-based and open to any compliant solution.",
   lens:"Good advisory work shapes requirements (interoperability, openness, safeguards) and leaves the choice of product to the country."},
  {t:"Write it around the DPG you prefer", fx:{adopt:3,pol:3,trust:-3,eco:-4}, set:["advBiased"],
   out:"It works technically. Local firms say the tender was wired.",
   lens:"Even a well-meant preference erodes an advisor's neutrality."},
  {t:"Refuse. Procurement is not your job", fx:{pol:-6},
   out:"The ministry hires a consultant who writes a 300-page tender.",
   lens:"Refusing to engage leaves the field to others. Advise on principles instead."}]},

{id:"adv_run", role:"adv", self:true, cat:"Advisor", ph:"B", title:"“Can't you just run it?”",
 text:"Frustrated with delays, the minister asks CDPI to take over management of the {block} program team.",
 opts:[
  {t:"No. Embed advisors while government builds its own team", fx:{cap:6,pol:-1},
   out:"Two government product leads are hired. Your team coaches them weekly.",
   lens:"Advisors build capacity. If the advisor leaves and the program stops, the advisory failed."},
  {t:"Yes, take over for a while", fx:{adopt:3,cap:-8,pol:2,rep:-3}, set:["advDependency"],
   out:"Delivery speeds up. Nobody in the ministry learns how.",
   lens:"Running a country's program creates dependency and blurs accountability."},
  {t:"Recommend hiring a program management firm", fx:{cash:-8,cap:2},
   out:"The firm brings process and invoices.",
   lens:"Outsourced management can help, but the government still needs its own leaders."}]},

{id:"adv_stretch", role:"adv", self:true, cat:"Advisor", ph:"BS", title:"Stretched thin",
 text:"Another country asks CDPI for urgent help. Your small team is already stretched working with {country}.",
 opts:[
  {t:"Stay focused on {country}", fx:{pol:3,cap:1},
   out:"The minister notices your commitment.",
   lens:"Depth of engagement matters more than breadth."},
  {t:"Split the team between both countries", fx:{pol:-4,cap:-2,eco:3},
   out:"Both countries get half an advisor. Response times double.",
   lens:"Thin engagement across many countries helps none of them much."},
  {t:"Bring in the partner network and connect the two countries", fx:{eco:5,cap:2,pol:-1},
   out:"The two countries start learning from each other directly.",
   lens:"Connecting countries for peer learning scales advice further than any single team."}]},

{id:"adv_fail", role:"adv", self:true, cat:"Advisor", ph:"BS", title:"The press calls CDPI",
 text:"A {block} service failed badly last week. Journalists ask CDPI whether the government ignored your advice.",
 opts:[
  {t:"Support the government in public, stay candid in private", fx:{pol:5,trust:1},
   out:"The minister calls to thank you, and asks what to do next.",
   lens:"Trusted advisors do not score points in public. Their candour belongs in the room."},
  {t:"Say publicly that they ignored your advice", fx:{pol:-12,trust:2},
   out:"Technically true. The ministry stops inviting you to meetings.",
   lens:"Public blame ends advisory relationships."},
  {t:"Offer a blameless lessons-learned note, published with the government", fx:{pol:1,trust:4,eco:3},
   out:"The note is widely shared. Other countries avoid the same mistake.",
   lens:"Blameless reviews turn failures into shared learning."}]},

{id:"adv_credit", role:"adv", self:true, cat:"Advisor", ph:"S", title:"Whose success is it?",
 text:"{block} reaches a major milestone. The minister's office asks how CDPI wants to be credited at the launch.",
 opts:[
  {t:"Let the government take full credit", fx:{pol:5},
   out:"The minister's speech does not mention you. The next request for help arrives the following week.",
   lens:"Country ownership is the goal. Advisors who need credit compete with the people they serve."},
  {t:"Ask for a CDPI logo on the stage", fx:{pol:-3,trust:-1},
   out:"The logo is there. So is some awkwardness.",
