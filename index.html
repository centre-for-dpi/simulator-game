   lens:"Visibility for the advisor can undermine the sense of national ownership."},
  {t:"Propose a joint case study for other countries later", fx:{pol:2,eco:4},
   out:"The case study becomes a reference for the region.",
   lens:"Shared documentation spreads lessons without taking credit away from the country."}]},

{id:"fired", role:"adv", cat:"Crisis", ph:"BS", title:"The champion is fired",
 text:"The Digital Minister who championed {block} is fired overnight in a cabinet reshuffle. The successor has never heard of the program.",
 opts:[
  {t:"Brief the successor in week one with a live demo and results",
   risk:{p:g=>0.25+g.stats.adopt/90+(has(g,"quickWin")?0.25:0),
         win:{fx:{pol:6}, out:"The new minister sees citizens using the service and adopts the program as their own."},
         lose:{fx:{pol:-7}, out:"There is not much to show yet. The minister puts the program “under review”."}},
   lens:"Delivered services are the best argument in a transition. A new leader can inherit a success, but not a slide deck."},
  {t:"Lean on career civil servants and the legal mandate",
   risk:{p:g=>0.3+(has(g,"lawPassed")?0.3:0)+(has(g,"multiStake")?0.2:0)+(has(g,"treasuryLine")?0.1:0),
         win:{fx:{cap:3,pol:-1}, out:"The law, the budget line and the team keep the rails running while the minister settles in."},
         lose:{fx:{pol:-10,adopt:-2}, out:"Without a legal mandate, the program is frozen for six months."}},
   lens:"Institutions, not individuals, should carry DPI. Champions change; laws, budget lines and teams stay."},
  {t:"Mobilise partners and civil society to lobby the President", fx:{pol:-5,trust:2,eco:2},
   out:"The program survives, but the new minister resents the pressure.",
   lens:"External pressure can save a program, at a cost to the relationship with the people who run it."}]},

{id:"hundred", cat:"Strategy", ph:"DB", not:["quickWin"], title:"Show results in 100 days",
 text:"The President wants something citizens can see from {block} within 100 days, not a roadmap.",
 opts:[
  {t:"+1: pick one {usecase} service, add a thin layer on existing systems, ship it", fx:{pol:9,adopt:4,cap:2,cash:-3}, set:["plusOne","quickWin"],
   out:"On day 96, the first families use the new service. The President shares the video.",
   lens:"The +1 approach delivers fast because it builds on what exists. Early delivery creates political momentum, which buys room for harder reforms."},
  {t:"Promise the complete platform in two years instead", fx:{pol:2,cash:-6}, set:["bigBang"], then:["fu_bigbang",3],
   out:"The announcement gets applause. Now nothing can be shown until the whole thing works.",
   lens:"Large promises with late delivery drain political capital while you wait."},
  {t:"Explain that it cannot be done properly in 100 days", fx:{pol:-6,trust:1},
   out:"Technically honest. Politically costly.",
   lens:"Saying no to speed is sometimes right, but a small real delivery usually is possible."}]},

{id:"wb_loan", role:"gov", cat:"Partners", ph:"B", not:["wbLoan"], title:"A World Bank DPI operation",
 text:"The World Bank offers a new $60M operation for DPI in {country}, covering {block} and {usecase}, with safeguards and results-based disbursement.",
 opts:[
  {t:"Take it, with disbursement tied to people served", fx:{cash:60,pol:3,trust:2}, set:["wbLoan","donorLoan"],
   out:"The money arrives in tranches as adoption milestones are met.",
   lens:"Results-based financing rewards delivery, not purchases. It also makes you measure what matters."},
  {t:"Take it, and put most of it into hardware and data centres", fx:{cash:60,pol:2,cap:-2}, set:["wbLoan","donorLoan"],
   out:"Servers arrive quickly. Services come later.",
   lens:"Infrastructure without services often produces idle capacity. Balance the investment."},
  {t:"Decline. Debt levels are already high", fx:{pol:1,cash:-2},
   out:"The finance ministry is relieved. You will need to find money elsewhere.",
   lens:"Borrowing for DPI should match the country's debt sustainability."}]},

{id:"mdb_scale", role:"gov", cat:"Partners", ph:"S", not:["mdbScale"], title:"A new loan to scale",
 text:"The {mdb} is impressed with {block} and offers a new $80M loan to scale it nationwide and add new services.",
 opts:[
  {t:"Take it and extend the rails to new sectors", fx:{cash:80,pol:3,eco:4}, set:["mdbScale","donorLoan"],
   out:"New sectors join. Repayments will start in a few years.",
   lens:"Scale-up financing works best when the rails are proven and the recurrent costs are budgeted."},
  {t:"Take a smaller $30M focused on inclusion and assisted access", fx:{cash:30,trust:4,adopt:3}, set:["mdbScale","assisted"],
   out:"Help points open in every district.",
   lens:"Financing the last mile is often the highest-impact use of scale-up money."},
  {t:"Decline and fund scale from the domestic budget", fx:{pol:-5,cash:15}, set:["treasuryLine"],
   out:"A long negotiation with Treasury, but no new debt.",
   lens:"Domestic funding signals full ownership of the rails."}]},

{id:"adv_side", role:"adv", self:true, cat:"Political", ph:"BS", title:"Taking sides",
 text:"Street protests and a no-confidence vote shake {country}. Both the government and the opposition ask CDPI to publicly back their position on {block}.",
 opts:[
  {t:"Stay strictly neutral and offer technical briefings to both sides", fx:{pol:2,trust:1,rep:4},
   out:"Neither side is thrilled. Both keep talking to you.",
   lens:"CDPI works with governments, not parties. Neutrality is what lets an advisor survive a change of power."},
  {t:"Publicly back the government", pure:true,
   risk:{p:0.5, win:{fx:{pol:8}, out:"The government survives the vote and rewards your loyalty."},
                 lose:{fx:{pol:-10}, set:["sacked"], out:"The government falls. The new ministers end CDPI's engagement on their first day."}},
   lens:"Backing one side is a bet on the outcome. If it loses, so do you."},
  {t:"Quietly side with the opposition", pure:true,
   risk:{p:0.5, win:{fx:{pol:6}, set:["newGov"], out:"The opposition takes power and keeps CDPI on."},
                lose:{fx:{pol:-10}, set:["sacked"], out:"The government finds out. CDPI is asked to leave the country."}},
   lens:"Secret political alignment destroys trust if it is discovered, and it usually is."}]},

{id:"review", repeat:true, cat:"Operations", ph:"DBS", title:"Quarterly review",
 text:"No fire to put out this quarter. The steering committee asks where the {rails} team should put its effort next.",
 opts:[
  {t:"An adoption drive for {usecase}", fx:{adopt:3,cash:-3},
   out:"Outreach teams and partners sign up new users across the country.",
   lens:"Most DPI work is steady delivery between the headlines."},
  {t:"Harden security and reliability", fx:{cap:3,cash:-2,trust:1},
   out:"Fewer incidents, faster recovery.",
   lens:"Operations and security are what keep infrastructure trusted."},
  {t:"Brief ministers and partners on results", fx:{pol:3,eco:1},
   out:"Cabinet sees the numbers. Partners line up for the next phase.",
   lens:"Showing results regularly keeps political support alive."},
  {t:"Inclusion outreach for people still left out", fx:{trust:3,adopt:1,cash:-3},
   out:"Assisted channels reach older people and remote communities.",
   lens:"The last mile is where DPI proves it is public infrastructure."}]},

/* ---------------- Bureaucracy and egos ---------------- */
{id:"redtape", cat:"Bureaucracy", ph:"DB", not:["fastTrack"], title:"Seven signatures",
 text:"The contract for the next {block} release needs seven signatures from four ministries. It has been stuck for eleven weeks.",
 opts:[
  {t:"Escalate to the President's office", fx:{pol:-5,adopt:2},
   out:"Signed within a week. Three permanent secretaries feel bypassed.",
   lens:"Escalation works once or twice. Each time it spends political capital and goodwill."},
  {t:"Walk it through every desk, patiently", fx:{adopt:-2,cap:1,trust:1},
   out:"It takes two more months. The next release slips.",
   lens:"Bureaucracy is a real cost in DPI delivery. Plan time for it."},
  {t:"Propose a fast-track procurement framework for DPI", fx:{pol:-3,cap:3}, set:["fastTrack"],
   out:"After a tough negotiation, DPI procurements get a standard, faster approval path.",
   lens:"Fixing the process once is better than fighting it every quarter."}]},

{id:"turf", cat:"Egos", ph:"DB", title:"Two ministers, one program",
 text:"The Digital Minister and the Finance Minister both want to be seen as the owner of {block}. Their teams have stopped sharing information.",
 opts:[
  {t:"Make them co-chairs of the steering committee", fx:{pol:-2,cap:-1,trust:1},
   out:"Both get a title. Meetings get longer, but the teams talk again.",
   lens:"Shared credit is often the price of cooperation."},
  {t:"Ask the President to decide",
   risk:{p:0.5, win:{fx:{pol:3}, out:"The President backs a clear owner, and the other minister accepts it."},
                lose:{fx:{pol:-8}, out:"The President hesitates. The feud goes public."}},
   lens:"Clear ownership helps, but forcing a decision can create a lasting enemy."},
  {antiDpi:true, t:"Split the program between their ministries", fx:{eco:-4,cap:-3,pol:2},
   out:"Two programs, two roadmaps, one confused public.",
   lens:"Splitting DPI along ministry lines breaks the interoperability that makes it valuable."}]},

{id:"ribbon", cat:"Egos", ph:"BS", title:"The minister's hometown",
 text:"The minister wants the next {usecase} launch in their home province next month, before it is ready.",
 opts:[
  {t:"Launch there on the minister's date",
   risk:{p:0.45, win:{fx:{pol:6,adopt:2}, out:"It holds. The minister is delighted."},
                 lose:{fx:{pol:2,trust:-6}, out:"The service crashes during the ceremony, on live TV."}},
   lens:"Political calendars and delivery readiness rarely match. Know which one you are following."},
  {t:"Offer a symbolic preview now and the full launch when ready", fx:{pol:1,trust:2},
   out:"The minister gets a photo, citizens get a working service a month later.",
   lens:"Giving leaders a visible moment without risking the service is a useful skill."},
  {t:"Say no", fx:{pol:-6},
   out:"Correct, and the minister will not forget it.",
   lens:"Egos are part of the political landscape of DPI."}]},

/* ---------------- Showcase platforms ---------------- */
{id:"summit", cat:"Platforms", ph:"BS", not:["caseStudy"], title:"The DPI Global Summit",
 text:"{country} is invited to the DPI Global Summit to present its {block} journey, and to become a case study for other countries.",
 opts:[
  {t:"Present, and publish an open case study", fx:{pol:5,eco:5,trust:2}, set:["caseStudy"],
   out:"Delegations from four countries ask to visit. Your team becomes a reference.",
   lens:"Case studies turn one country's experience into a public good that others can reuse."},
  {t:"Send the team to learn from other countries", fx:{cap:5,eco:2},
   out:"Your architects come back with three ideas to steal.",
   lens:"Global platforms are for learning as much as for showcasing."},
  {t:"Skip it this year", fx:{eco:-2,pol:-1},
   out:"The summit goes ahead without you.",
   lens:"Visibility brings partners, peers and funding."}]},

{id:"showcase50", cat:"Platforms", ph:"S", req:["fiftyIn5"], not:["caseStudy"], title:"A 50-in-5 showcase",
 text:"The 50-in-5 campaign invites {country} to share its progress as a case study for the next cohort of countries.",
 opts:[
  {t:"Share the full journey, including what went wrong", fx:{pol:4,eco:5,trust:3}, set:["caseStudy"],
   out:"The case study becomes required reading for the new cohort.",
   lens:"Candid case studies are one of the fastest ways DPI knowledge spreads."},
  {t:"Host a peer visit for three countries", fx:{eco:4,cap:3,pol:2},
   out:"Three delegations spend a week with your team.",
   lens:"Seeing systems in operation teaches more than any report."}]},

/* ---------------- Funders and champions ---------------- */
{id:"codevelop", role:"gov", cat:"Partners", ph:"DB", title:"Catalytic funding",
 text:"Co-Develop offers catalytic funding to help {country} build {block} and grow the local ecosystem around it.",
 opts:[
  {t:"Use it for the core build, on open standards", fx:{cash:12,cap:3,pol:2}, set:["openStandards"],
   out:"The funding unlocks the first release and gives other funders confidence.",
   lens:"Catalytic funding de-risks early DPI work and crowds in larger investments."},
  {t:"Use it to grow local implementers and startups", fx:{cash:8,eco:7,pol:2},
   out:"Local firms get certified and start building services on the rails.",
   lens:"A strong local ecosystem is what keeps DPI running after the first funding ends."}]},

{id:"funders", role:"adv", self:true, cat:"Partners", ph:"BS", not:["funded"], title:"CDPI's funders check in",
 text:"Co-Develop and the Gates Foundation, CDPI's main funders, ask how the advisory work in {country} is going and what would help it scale.",
 opts:[
  {t:"Share honest impact data: people reached, what worked, what did not", fx:{pol:3,eco:3}, set:["funded"],
   out:"The funders extend support, so CDPI can take on more countries without stretching the team as much.",
   lens:"Transparent reporting of results builds long-term partnerships with funders."},
  {t:"Propose a regional program to reuse the playbook in more countries", fx:{eco:5,cap:2}, set:["funded"],
   out:"The funders back a regional approach. New countries become easier to support.",
   lens:"Reusing playbooks across countries is how philanthropic support scales impact."}]},

{id:"nilekani", cat:"Champions", ph:"BS", not:["metNilekani"], title:"A visit from Nandan Nilekani",
 text:"Nandan Nilekani, a long-time supporter of CDPI, visits {country} to share lessons from India's DPI journey and offers to help your {block} program.",
 opts:[
  {t:"Arrange a session with the President and cabinet", fx:{pol:7,trust:2}, set:["metNilekani"],
   out:"Cabinet leaves with a clearer picture of what DPI can do, and a stronger commitment to it.",
   lens:"Senior champions who have done it before can shift political conviction quickly."},
  {t:"Host a public town hall on DPI and trust", fx:{trust:5,adopt:2,pol:2}, set:["metNilekani"],
   out:"Citizens and journalists get their questions answered. Coverage is warm.",
   lens:"Explaining DPI in public builds understanding and trust."},
  {t:"Hold a working session with the delivery team", fx:{cap:6,pol:1}, set:["metNilekani"],
   out:"Your team gets hard-won lessons on scale, adoption and governance.",
   lens:"Practical lessons from scaled systems save years of mistakes."}]},

{id:"varma", cat:"Champions", ph:"DB", not:["metVarma"], title:"The CDPI chair joins a session",
 text:"Pramod Varma, CDPI's chair, joins a working session with your architects on {block} and how the rails fit together.",
 opts:[
  {t:"Review the architecture for minimalism and interoperability", fx:{cap:6,eco:3,pol:1}, set:["metVarma","openStandards"],
   out:"The design gets simpler. Two planned components turn out to be unnecessary.",
   lens:"Minimal, interoperable building blocks with open APIs are the core of the DPI approach."},
  {t:"Explore how AI Blocks and DPI Workflows can connect the rails", fx:{cap:5,adopt:2,pol:1}, set:["metVarma"],
   out:"The team maps where AI can integrate the rails into single journeys for {usecase}.",
   lens:"AI is the integration layer for DPI when it sits outside the rails and works through governed workflows."}]},

{id:"gatesvisit", cat:"Champions", ph:"S", not:["metGates"], title:"Global attention",
 text:"Bill Gates meets {country}'s finance minister to discuss digital public infrastructure and how it can reach the poorest families.",
 opts:[
  {t:"Focus the meeting on inclusion results for {usecase}", fx:{pol:5,trust:3,eco:2}, set:["metGates"],
   out:"The meeting puts inclusion at the top of the finance ministry's agenda.",
   lens:"Global champions can help keep inclusion in the spotlight."},
  {t:"Focus on scaling the rails to more sectors", fx:{pol:5,eco:4}, set:["metGates"],
   out:"The finance minister leaves determined to fund the next phase.",
   lens:"High-level attention can help secure domestic budget for scale."}]},

/* ---------------- Conflict, migration and climate ---------------- */
{id:"war_prices", cat:"Crisis", ph:"BS", title:"A war far away",
 text:"A major war abroad, like the war in Ukraine, sends global fuel, food and fertiliser prices soaring. Families in {country} feel it within weeks.",
 opts:[
  {delivery:true, t:"Target support to the poorest through the registry and payment rails",
   risk:{p:g=>0.25+g.stats.adopt/90, win:{fx:{pol:6,trust:5,adopt:3}, out:"Support reaches the families who need it most within a month."},
                lose:{fx:{pol:-3,trust:-3}, out:"The rails do not reach enough people yet. Many poor families are missed."}},
   lens:"Shock-responsive social protection depends on DPI being in place before the crisis hits."},
  {t:"A general fuel subsidy for everyone", fx:{cash:-12,pol:4,trust:-1},
   out:"Prices at the pump fall. Most of the benefit goes to the people who drive the most.",
   lens:"Untargeted subsidies are expensive and regressive. DPI makes targeting possible."}]},

{id:"refugees", when:g=>hasLandBorder(g), cat:"Crisis", ph:"BS", title:"Refugees at the border",
 text:"Fighting in a neighbouring country, as in South Sudan's conflicts, sends tens of thousands of refugees across the border into {country}.",
 opts:[
  {t:"Register them, with functional IDs and credentials to access services and work", fx:{cash:-6,trust:5,adopt:3,eco:3,pol:-3}, set:["inclusiveId"],
   out:"Refugees can prove who they are, see a doctor and find work. Aid agencies use the same records.",
   lens:"Rights-based identity for displaced people is a core safeguard: no one should be left without a legal identity."},
  {t:"Keep them outside national systems, in camps run by aid agencies", fx:{pol:3,trust:-4},
   out:"Short-term calm. Years later, a generation has no record in any system.",
   lens:"Leaving displaced people out of DPI creates exclusion that lasts for decades."}]},

{id:"conflict_zone", when:g=>hasLandBorder(g), cat:"Crisis", ph:"BS", title:"Violence in a border region",
 text:"Armed groups take control of a border region of {country}. Registration offices close, and the records there are at risk.",
 opts:[
  {t:"Protect records with offline backups and keep services going through mobile teams", fx:{cash:-6,cap:3,trust:4}, set:["offline"],
   out:"The records are safe, and people in the region can still reach services.",
   lens:"Resilient, offline-capable DPI keeps serving people in conflict zones."},
  {t:"Suspend all services in the region until it is safe", fx:{adopt:-3,trust:-2},
   out:"Services stop. People lose access to benefits when they need them most.",
   lens:"Suspension protects staff but leaves the most vulnerable without support."},
  {t:"Give the security forces full access to the population database", fx:{pol:4,trust:-14}, set:["spyAccess"],
   out:"The data is used to profile people by ethnicity and location. Human rights groups raise the alarm.",
   lens:"Using DPI data for security profiling breaks the UN Universal DPI Safeguards and can put lives at risk."}]},

{id:"migrants_in", when:g=>hasLandBorder(g), cat:"Migration", ph:"BS", title:"A migration wave",
 text:"Hundreds of thousands of people arrive, fleeing an economic and political crisis next door, as Venezuelans did in Colombia.",
 opts:[
  {t:"Temporary protection status, with verifiable credentials migrants can use", fx:{cash:-5,adopt:4,eco:4,trust:4,pol:-3}, set:["inclusiveId"],
   out:"Migrants can work legally, open bank accounts and enrol their children in school.",
   lens:"Colombia issued verifiable credentials to Venezuelan migrants with temporary protection permits: DPI as a tool for inclusion and integration."},
  {t:"Emergency aid only, with no legal status", fx:{pol:2,trust:-3,eco:-2},
   out:"Informal work and exclusion grow. Migrants stay invisible to the system.",
   lens:"Without identity and status, migrants cannot contribute to the formal economy."},
  {t:"Close the border", fx:{pol:4,trust:-7},
   out:"Crossings move to dangerous informal routes.",
   lens:"Closing borders rarely stops migration. It pushes it out of sight."}]},

{id:"diaspora", cat:"Migration", ph:"BS", title:"Citizens abroad",
 text:"Many people from {country} live and work abroad. They struggle to prove their identity, send money home and use public services from far away.",
 opts:[
  {t:"Remote onboarding and credentials that work across borders", fx:{eco:5,adopt:4,cap:-1}, set:["crossBorder"],
   out:"Citizens abroad can renew documents, sign in to services and prove qualifications from anywhere.",
   lens:"DPI that works across borders serves citizens wherever they live."},
  {t:"Cheaper remittances on the national payment rail", fx:{adopt:4,eco:4,cash:-3}, add:{block:"pay"},
   out:"Sending money home gets cheaper and faster. Families feel the difference.",
   lens:"Interoperable payment rails can cut remittance costs dramatically."},
  {t:"Leave it to the consulates", fx:{pol:-1,trust:-2},
   out:"The queues at consulates stay long.",
   lens:"Paper-based consular services cannot scale to large diasporas."}]},

{id:"drought", cat:"Climate", ph:"BS", title:"The worst drought in forty years",
 text:"A severe drought is forecast for the farming regions of {country}, months before the harvest fails.",
 opts:[
  {delivery:true, t:"Anticipatory cash: trigger payments from climate data, through the registry",
   risk:{p:g=>0.3+g.stats.adopt/90+(g.blocks.length>=2?0.1:0), win:{fx:{pol:6,trust:5,adopt:4}, out:"Farmers receive support before crops fail. They keep their livestock and their seeds."},
                lose:{fx:{pol:-3,trust:-2}, out:"The registry misses too many farmers. Payments reach only some of them."}},
   lens:"Climate-triggered anticipatory action only works when registries, payments and data exchange are already connected."},
  {t:"Emergency food aid once the harvest fails", fx:{cash:-8,pol:1},
   out:"Aid arrives after families have already sold their animals.",
   lens:"Reacting after the shock costs more and protects less."}]},

{id:"heat", cat:"Climate", ph:"BS", title:"A deadly heatwave",
 text:"A record heatwave overwhelms hospitals in {country}. Health workers need to reach the most vulnerable people fast.",
 opts:[
  {t:"Alert older and chronically ill people through consented data sharing", fx:{trust:4,adopt:3,cap:2},
   out:"Voice and SMS alerts reach older people in their own language. Hospital admissions fall.",
   lens:"Consent-based data sharing and AI voice blocks can save lives in climate emergencies."},
  {t:"A general public warning on TV and radio", fx:{trust:-2},
   out:"Many people hear it. Those most at risk often do not.",
   lens:"Targeted alerts reach the people broadcast warnings miss."}]},

{id:"sealevel", cat:"Climate", ph:"S", trait:["islands","lowCoast"], title:"Rising seas",
 text:"Coastal communities in {country} must relocate as sea levels rise. People fear losing their land records and their rights.",
 opts:[
  {t:"Portable digital land and identity credentials for every relocated family", fx:{trust:6,adopt:3,cash:-5},
   out:"Families keep proof of what they owned and who they are, wherever they move.",
   lens:"Portable, verifiable records protect the rights of climate-displaced people."},
  {t:"Relocate first, sort out the records later", fx:{pol:2,trust:-5},
   out:"Land disputes multiply in the new settlements.",
   lens:"Records lost in displacement are very hard to rebuild."}]},

/* ---------------- Consequences of skipping the UN safeguards ---------------- */
{id:"safeg_review", cat:"Safeguards", ph:"S", not:["safeguards"], title:"The safeguards gap",
 text:"An independent review of {rails}, using the UN Universal DPI Safeguards framework, finds serious gaps: no grievance redress, weak consent and no oversight body.",
 opts:[
  {t:"Accept the findings and fix them: grievance redress, consent, oversight", fx:{cash:-8,trust:7,pol:-2}, set:["safeguards","grievance"],
   out:"The fixes take a year. Trust starts to recover.",
   lens:"Safeguards applied late cost far more than safeguards designed in from the start."},
  {t:"Fix only the most visible problem", fx:{cash:-3,trust:2},
   out:"The headline issue goes away. The underlying gaps remain.",
   lens:"Partial fixes leave the system exposed to the next harm."},
  {t:"Dismiss the review", fx:{trust:-12,pol:-3,eco:-4},
   out:"Civil society and partners lose confidence. New integrations stall.",
   lens:"Ignoring safeguards findings costs trust, partnerships and adoption."}]},

{id:"fu_safeg", fu:true, cat:"Safeguards", title:"Harm you could have prevented",
 text:"Two years after the safeguards assessment was skipped, an independent review finds that thousands of eligible people were wrongly excluded from {usecase}.",
 opts:[
  {t:"Accept the findings, reinstate people and fix the design", fx:{cash:-8,trust:4,pol:-3}, set:["safeguards","grievance"],
   out:"People are reinstated and a grievance channel opens. It costs far more than the assessment would have.",
   lens:"Applying the UN safeguards late is expensive. Applying them early is cheap."},
  {t:"Dispute the review", fx:{trust:-12,pol:-4,eco:-4},
   out:"The story grows. Partners put new work on hold until the issues are addressed.",
   lens:"Exclusion that is denied rather than fixed becomes a legitimacy crisis."}]},

{id:"uc_land", uc:["land"], cat:"Strategy", ph:"BS", title:"Titles that unlock credit",
 text:"Smallholders in {country} could use their land titles to borrow, but banks cannot verify them.",
 opts:[
  {t:"Issue verifiable land title credentials banks can check", fx:{eco:7,adopt:5,trust:2,cash:-4},
   out:"The first loans backed by digital titles are approved within days.",
   lens:"Verifiable titles turn land into collateral, as long as the underlying registry is accurate."},
  {t:"Fix disputed records before going digital", fx:{trust:5,cap:3,adopt:1,cash:-3},
   out:"Slower, but the digital titles people receive are ones they can rely on.",
   lens:"Credentials digitise records; they cannot fix a disputed registry."}]},

{id:"uc_pension", uc:["pension"], cat:"Inclusion", ph:"BS", title:"Proof of life",
 text:"Every year, older people in {country} travel to an office to prove they are alive so their pension keeps coming.",
 opts:[
  {t:"Remote proof of life, with assisted options at post offices", fx:{adopt:6,trust:5,cash:-3}, set:["assisted"],
   out:"Pensioners confirm from home or at the nearest post office. Queues disappear.",
   lens:"Designing for older people means multiple channels and human help, not only an app."},
  {t:"Automatic checks against the death registry", fx:{adopt:3,cash:5,trust:-6},
   out:"Payments to deceased people stop. A few living pensioners are wrongly flagged.",
   lens:"Automated checks need a fast appeal route for errors."}]},

{id:"uc_disaster", uc:["disaster"], cat:"Climate", ph:"BS", title:"Ready before the storm",
 text:"Forecasters warn of a severe season of storms and floods. {country} wants to support families within days, not months.",
 opts:[
  {t:"Pre-register at-risk households and pre-approve payments", fx:{adopt:6,trust:4,cash:-4}, set:["anticipatory"],
   out:"When the storm hits, support reaches families in 72 hours.",
   lens:"Anticipatory, data-driven response only works if the rails exist before the disaster."},
  {t:"Plan to register people after the disaster", fx:{pol:-1,trust:-1},
   out:"Registration queues form in the rain.",
   lens:"Registration after a disaster is slow and misses the most affected."}]},

{id:"mapper", cat:"Technical", ph:"BS", when:g=>g.blocks.includes("pay") && !has(g,"accountMapper"), title:"Paying people directly",
 text:"To pay benefits straight into people's accounts, {country} needs an ID–account mapper: a secure link between each person's ID and the bank or mobile money account they choose.",
 opts:[
  {t:"Build it with consent, and accept functional IDs, not only the national ID", fx:{cap:4,trust:4,adopt:3,cash:-5}, set:["accountMapper","g2p"],
   out:"Benefits can now go straight to any account a person chooses, even before they have a national ID.",
   lens:"The ID Account Mapper is one of CDPI's DaaS kits: each ID maps to one financial address, people can update their account themselves, and multiple IDs can belong to one person. In Liberia, adding functional IDs meant low national ID coverage would not block G2P payments."},
  {t:"Build it for national ID holders only", fx:{cap:3,adopt:2,trust:-3,cash:-4}, set:["accountMapper","g2p"],
   out:"Payments work for most people. Those without a national ID are left out.",
   lens:"Mapping only one ID type excludes the people G2P is meant to reach."},
  {t:"Keep paying through agents in cash", fx:{cash:-2},
   out:"Leakage and delays continue.",
   lens:"Without the mapper, G2P cannot run fully on the rails."}]},

{id:"fintech", cat:"Ecosystem", ph:"BS", not:["fintechDone"], when:g=>g.blocks.length>=2||has(g,"openAccess")||has(g,"authGateway"), title:"A startup builds on your rails",
 text:"A local fintech wants to launch a service on {rails}: instant micro-loans and savings for people who have never had a bank account.",
 opts:[
  {privSector:true, t:"Certify it and give it access through the open APIs", fx:{eco:6,priv:9,pol:1}, set:["fintechDone","openAccess"],
   out:"The app signs up millions of first-time users within a year, all reached through the rails.",
   lens:"Government builds the rails; private innovators build services on top. The people they reach are DPI impact too."},
  {privSector:true, t:"Partner with it, under strict consumer protection rules", fx:{eco:4,priv:4,trust:3}, set:["fintechDone"],
   out:"Growth is slower, and complaints are rare.",
   lens:"Innovation and consumer protection can go together."},
  {t:"Keep private companies off the rails for now", fx:{trust:1,eco:-8}, set:["fintechDone"],
   out:"The startup builds on a closed platform instead.",
   lens:"Closing the rails to innovators limits how many people they can reach."}]},

/* IdLAC: regional cross-border digital identity for Latin America and the Caribbean (Red GEALC). */
{id:"idlac", cat:"Partners", ph:"BS", not:["idlac","idlacNo"], when:g=>REGION_OF[g.country]==="lac" && (g.blocks.includes("id")||has(g,"hasID")),
 title:"Join IdLAC?",
 text:"IdLAC connects national digital identities across Latin America and the Caribbean, so people can use their own ID for public services in other countries. {country} can connect its national ID through an identity broker, or stay out.",
 opts:[
  {t:"Join IdLAC and connect the national ID through an identity broker", pure:true,
   risk:{p:0.7, win:{fx:{eco:7,pol:3,trust:2,cap:2}, set:["crossBorder","idlac","openStandards"],
                     out:"Citizens can now use their national digital ID for procedures in other IdLAC countries, starting with migration, trade, education, health and tax."},
                lose:{fx:{eco:6,cap:2,trust:-4,pol:-3}, set:["crossBorder","idlac","openStandards"],
                     out:"Cross-border services go live, but the opposition claims sovereignty over citizens' data is being given away. The debate dominates the news for weeks."}},
   lens:"IdLAC is built by the governments of Red GEALC, with a regional consortium that includes the IDB, the World Bank, Co-Develop and the OAS. Each country keeps its own ID; explaining that clearly is what protects public support."},
  {t:"Start with one neighbour: a bilateral pilot of cross-border procedures", pure:true,
   risk:{p:0.85, win:{fx:{eco:4,pol:2,cap:1}, set:["crossBorder","idlac"], out:"The first cross-border procedures go live with one neighbour, and more are added each quarter."},
                 lose:{fx:{eco:3,trust:-2,pol:-2}, set:["crossBorder","idlac"], out:"The pilot works, but a few critics question sharing data with a neighbour."}},
   lens:"Brazil and Uruguay started with 39 cross-border procedures in 2024 and passed 300 in 2025. Starting small builds trust step by step."},
  {t:"Stay out of IdLAC for now", fx:{pol:1,eco:-3}, set:["idlacNo"],
   out:"Sovereignty-minded voters approve. Traders and migrants keep using paper across borders.",
   lens:"Staying out is a legitimate choice, at the cost of the cross-border services neighbours are building."}]},

/* ---------------- Follow-ups (consequences of earlier choices) ---------------- */
{id:"fu_quickwin", fu:true, cat:"Political", not:["quickWin"], title:"The first quick win",
 text:"Thanks to the +1 layer, the first {usecase} service could go live in one province next month, years before a full platform would.",
 opts:[
  {t:"Launch it publicly with the President, and name the next three services", fx:{pol:10,adopt:5,trust:2}, set:["quickWin"],
   out:"The launch leads the news. Ministers start asking to be next.",
   lens:"Visible early delivery turns DPI from a technical project into a political asset, and that momentum pays for the harder reforms."},
  {t:"Launch quietly and fix issues first", fx:{pol:3,adopt:3,cap:2}, set:["quickWin"],
   out:"A smooth soft launch. Few people outside the province notice.",
   lens:"A quiet launch reduces risk but gives up some of the political momentum."},
  {t:"Wait until the service is available nationwide", fx:{pol:-4,cap:1},
   out:"The window passes. Cabinet attention moves elsewhere.",
   lens:"Waiting for completeness wastes the main advantage of the +1 approach: speed."}]},

{id:"fu_daas", fu:true, cat:"Orchestration", title:"Running what you own",
 text:"The DaaS package is live on {country}'s own infrastructure. Now someone has to run it, extend it and support it.",
 opts:[
  {t:"Build an in-house operations team with certified local integrators", fx:{cash:-6,cap:6,eco:4}, set:["cloudAgnostic"],
   out:"Your team runs releases and incidents. Local firms handle new integrations.",
   lens:"A package only becomes national infrastructure when the country can operate and evolve it."},
  {t:"Reuse the same package for new sectors and credentials", fx:{adopt:5,eco:4,cash:-3}, set:["secondBlock"],
   out:"Health, education and business credentials launch on the same rails.",
   lens:"Avoid accidental verticalisation: a platform built for one sector should become a reusable data sharing DPI."},
  {antiDpi:true, t:"Hand operations to a single vendor", fx:{cash:-10,adopt:2}, set:["vendorLock"],
   out:"Convenient for now. The vendor starts proposing proprietary add-ons.",
   lens:"Open code can still be locked in through operations contracts."}]},

{id:"fu_target", fu:true, cat:"Political", title:"The target you announced",
 text:"At the G20 you promised 80% adoption. The deadline is close.",
 opts:[
  {t:"Report the real numbers and reset the target with a plan", fx:{pol:-4,trust:4},
   out:"Painful, but credible. The press moves on.",
   lens:"Honest course correction protects trust better than a missed promise."},
  {t:"Count every account ever created as adoption", fx:{pol:3,trust:-7},
   out:"You hit 80% on paper. Journalists count active users instead.",
   lens:"Vanity metrics hide the real state of the rails. Measure active, meaningful use."},
  {t:"Push a mandatory enrolment drive", fx:{adopt:10,trust:-8,cash:-6},
   out:"Numbers jump, and so do complaints.",
   lens:"Rushing to meet a target often trades inclusion for speed."}]},

{id:"fu_vendor", fu:true, cat:"Procurement", title:"The vendor's next invoice",
 text:"Remember the turnkey deal? The vendor now quotes $28M to connect {block} to the tax and health systems, and says only its engineers can do it.",
 opts:[
  {t:"Pay. There is no alternative", fx:{cash:-28,eco:3,adopt:3},
   out:"The integration arrives nine months late.",
   lens:"Lock-in shows up in year two, not on signing day."},
  {t:"Wrap it: build an open-standards layer around the closed system", fx:{cash:-10,cap:5,eco:6}, set:["openStandards","plusOne"],
   out:"You add open APIs around the vendor's system. The vendor protests but cannot stop you.",
   lens:"The +1 approach can even wrap a closed system: add open interfaces around it and reduce dependence over time."},
  {t:"Take them to arbitration",
   risk:{p:0.4, win:{fx:{cash:5,pol:3}, set:["openStandards"], clr:["vendorLock"], out:"The arbitrator rules that the data model and the data belong to the state."},
                lose:{fx:{cash:-15,pol:-5}, out:"Eighteen months of legal fees, and you lose."}},
   lens:"Exit rights, source code escrow and data ownership belong in the original contract, where they are cheap."}]},

{id:"fu_ambassador", fu:true, cat:"Procurement", title:"The ambassador calls",
 text:"Your open tender is in its final stage. An ambassador visits the Minister and hints that trade talks could suffer if their national champion does not win.",
 opts:[
  {t:"Hold the line: the evaluation committee decides", fx:{pol:-6,trust:5,eco:3},
   out:"The best bid wins. Trade talks cool for a month, then resume.",
   lens:"Transparent, rules-based procurement protects governments from exactly this kind of pressure."},
  {t:"Split the contract to keep everyone happy", fx:{cash:-8,cap:-3,eco:-2},
   out:"Two vendors, two architectures, one headache.",
   lens:"Splitting contracts for political reasons fragments the architecture."},
  {t:"Award it to their champion", fx:{pol:6,trust:-7}, set:["vendorLock"], clr:["openStandards"],
   out:"The embassy is delighted. The losing bidders file complaints.",
   lens:"Geopolitical procurement often brings lock-in with it."}]},

{id:"fu_dpg", fu:true, cat:"Capacity", title:"Who supports the open-source stack?",
 text:"Your local integrators are new to {dpg}. A critical bug has been open for three weeks.",
 opts:[
  {t:"Engage the DPG community and certified partners", fx:{cash:-5,cap:6,eco:4},
   out:"A maintainer from another country helps fix it in two days.",
   lens:"DPGs come with communities. Budget for support contracts and take part in governance."},
  {t:"Hire a global systems integrator", fx:{cash:-12,cap:2,adopt:2},
   out:"The bug is fixed. The invoice is large.",
   lens:"Open source does not remove the need to pay for expertise."},
  {t:"Our team will figure it out",
   risk:{p:g=>g.stats.cap/100, win:{fx:{cap:8}, set:["contributor"], out:"Your engineers fix it and contribute the patch upstream."},
                lose:{fx:{adopt:-3,trust:-4,pol:-3}, out:"The bug causes a two-week outage."}},
   lens:"In-house capacity turns open source into real sovereignty."}]},

{id:"fu_bigbang", fu:true, cat:"Strategy", title:"Nothing to show",
 text:"The big-bang platform is 60% over budget and a year late. Cabinet asks what citizens have received so far. The answer is nothing.",
 opts:[
  {t:"Cut scope: ship a minimum version in three months", fx:{cash:-5,adopt:5,cap:2,pol:3}, set:["plusOne","quickWin"], clr:["bigBang"],
   out:"A smaller system goes live. People finally see something.",
   lens:"Shipping small and iterating beats waiting for the perfect system."},
  {t:"Ask for another $30M to finish properly",
   risk:{p:0.45, win:{fx:{cash:30,pol:-5}, out:"Cabinet agrees, reluctantly. This is your last chance."},
                 lose:{fx:{pol:-12}, out:"Cabinet refuses and asks for your resignation letter, just in case."}},
   lens:"Sunk costs are a poor argument in cabinet."},
  {t:"Launch the full system anyway",
   risk:{p:0.35, win:{fx:{adopt:12,pol:8}, clr:["bigBang"], out:"It works. Nobody quite believes it."},
                 lose:{fx:{trust:-12,pol:-8}, out:"Half the modules fail on day one."}},
   lens:"Big-bang launches concentrate risk on a single day."}]},

{id:"fu_recovery", fu:true, cat:"Strategy", title:"After the crash",
 text:"The failed nationwide launch is still a punchline. Enrolment has stalled and staff morale is low.",
 opts:[
  {t:"Relaunch district by district, with public progress reports", fx:{trust:6,adopt:3,pol:-3},
   out:"Slowly, the numbers and the jokes turn around.",
   lens:"Rebuilding trust takes visible, steady delivery."},
  {t:"Replace the leadership team and start over", fx:{pol:4,cap:-6,cash:-5},
   out:"New faces, same problems, less knowledge.",
   lens:"Firing the team that learned the hard lessons loses those lessons."},
  {t:"Pay influencers to change the story", fx:{cash:-4,trust:-4,pol:2},
   out:"A journalist reveals the influencer contracts.",
   lens:"You cannot market your way out of a delivery problem."}]},

{id:"fu_freebill", fu:true, cat:"Procurement", title:"Year two of the free pilot",
 text:"The free pilot was popular. Now the company presents the bill for year two: $30M a year, and all the data sits in its cloud.",
 opts:[
  {t:"Pay it. People like the app", fx:{cash:-30,adopt:3}, set:["vendorLock"],
   out:"The app stays. So does the dependency.",
   lens:"The real price of a free pilot often arrives in year two."},
  {t:"Migrate to a DPG, with pain", fx:{cash:-12,adopt:-4,cap:5}, set:["openSource"],
   out:"Users grumble through the switch. You own the platform now.",
   lens:"Migration is possible, but exit terms should be negotiated before the pilot starts."},
  {t:"Negotiate a public-interest price",
   risk:{p:0.5, win:{fx:{cash:-10,eco:2}, out:"The company accepts a reduced price and data portability."},
                lose:{fx:{cash:-22,pol:-3}, set:["vendorLock"], out:"The company refuses. You pay almost full price."}},
   lens:"Leverage is highest before you depend on a vendor."}]},

{id:"fu_chatbot", fu:true, cat:"AI", title:"The chatbot at scale",
 text:"The AI chatbot connected to citizen data now answers two million questions a month. An audit finds it gives wrong answers 8% of the time.",
 opts:[
  {t:"Rebuild it as scoped AI Blocks behind governed APIs", fx:{cash:-8,trust:4,cap:4}, set:["aiBlock"],
   out:"Accuracy improves and the AI no longer touches raw records.",
   lens:"External, scoped AI Blocks with human review are easier to govern than an all-knowing chatbot."},
  {t:"Add a disclaimer",
   risk:{p:0.5, win:{fx:{pol:2}, out:"The disclaimer holds, for now."},
                lose:{fx:{trust:-12,pol:-4}, out:"A family loses a benefit after following its advice. It leads the evening news."}},
   lens:"Disclaimers do not transfer accountability to citizens."},
  {t:"Switch it off", fx:{pol:-6,trust:2},
   out:"The President is embarrassed. Citizens barely notice.",
   lens:"Pulling a failing AI service is better than letting it cause harm."}]},

{id:"fu_law", fu:true, cat:"Legal", not:["lawPassed"], title:"The bill in Parliament",
 text:"Your DPI and data protection bill is stuck. The opposition will support it if the regulator gets real independence and a bigger budget.",
 opts:[
  {t:"Accept their amendments", fx:{pol:-4,trust:6,cash:-4}, set:["lawPassed"],
   out:"The law passes with cross-party support. It will be hard to repeal.",
   lens:"Cross-party laws protect DPI from political cycles."},
  {t:"Trade votes for road projects in their districts", fx:{pol:-8,cash:-6,trust:-3}, set:["lawPassed"],
   out:"The law passes. The deal leaks.",
   lens:"How a law passes affects how legitimate it feels."},
  {t:"Force a vote",
   risk:{p:g=>g.stats.pol/90, win:{fx:{pol:-2}, set:["lawPassed"], out:"The law passes narrowly."},
                lose:{fx:{pol:-8}, out:"The bill fails by four votes."}},
   lens:"Political capital decides close votes."}]},

{id:"fu_donor", fu:true, cat:"Partners", title:"The mid-term review",
 text:"The {mdb}'s mid-term review is supportive, but flags that procurement delays on your side are slowing disbursement. Its team offers to help get back on track.",
 opts:[
  {t:"Work with the {mdb} team to restructure around results", fx:{pol:3,cash:8,cap:3},
   out:"You agree results-based milestones together: people served, not servers bought.",
   lens:"Outcome-based financing aligns partners and governments on what matters."},
  {t:"Fast-track procurement with a direct award", fx:{cash:10,trust:-5,pol:1},
   out:"Money flows again. Local transparency groups ask why there was no tender.",
   lens:"Speed in procurement should not come at the cost of openness."},
  {t:"Keep going as before", fx:{cash:-10,pol:-3},
   out:"The delays continue and unspent funds have to be returned.",
   lens:"Partners can only move as fast as the government can absorb their support."}]},

{id:"fu_consult", fu:true, cat:"Capacity", title:"The consultants leave",
 text:"The consulting contract has ended. Nobody in the ministry knows how to deploy a new release of {block}.",
 opts:[
  {t:"Extend the contract", fx:{cash:-12},
   out:"The consultants return, at a higher rate.",
   lens:"Dependence on consultants is lock-in by another name."},
  {t:"Emergency hiring and knowledge transfer", fx:{cash:-6,cap:6,pol:-2},
   out:"Painful months, but the knowledge is now in-house.",
   lens:"Knowledge transfer should be a contract deliverable from day one."},
  {t:"Freeze all releases", fx:{adopt:-2,cap:-2},
   out:"Bugs pile up.",
   lens:"Infrastructure that cannot be updated slowly decays."}]},

{id:"fu_lawsuit", fu:true, cat:"Legal", title:"Exclusion lawsuit",
 text:"A coalition sues: thousands lost their benefits after the mandatory {block} deadline.",
 opts:[
  {t:"Settle: reinstate benefits and add fallback channels", fx:{cash:-8,trust:6}, set:["assisted"],
   out:"Benefits are restored and assisted channels open.",
   lens:"Fallback channels should exist before mandates, not after lawsuits."},
  {t:"Fight it in court",
   risk:{p:0.35, win:{fx:{pol:3}, out:"The court rules for the government. The anger stays."},
                lose:{fx:{trust:-10,pol:-5}, out:"The court rules against you and suspends the mandate."}},
   lens:"Courts are increasingly scrutinising exclusion in digital public services."}]},

{id:"fu_lake", fu:true, cat:"Safeguards", title:"The intelligence service calls",
 text:"The intelligence service asks for real-time access to the national data lake, for national security.",
 opts:[
  {t:"Only with a court warrant, case by case, and logged", fx:{trust:5,pol:-4}, set:["auditLogs"],
   out:"The service grumbles and files warrants.",
   lens:"Lawful, proportionate and logged access is a core safeguard."},
  {t:"Grant access quietly", fx:{pol:3,trust:-8}, set:["spyAccess"],
   out:"No one needs to know. For now.",
   lens:"Secret access tends to become public."},
  {t:"Break up the lake into federated sources", fx:{cash:-12,cap:4,trust:8}, clr:["dataLake"],
   out:"There is no longer a single place to ask.",
   lens:"Federated architectures limit what any one actor can access."}]},

/* ---------------- Country traits ---------------- */
{id:"t_fragile_pres", cat:"Political", ph:"BS", trait:["fragilePolitics"], title:"Congress removes the President",
 text:"Congress votes to remove the President of {country}. An interim government takes over, and every program is up for review.",
 opts:[
  {t:"Rely on the legal mandate and the career team to keep the rails running",
   risk:{p:g=>0.35+(has(g,"lawPassed")?0.3:0)+(has(g,"multiStake")?0.15:0)+(has(g,"treasuryLine")?0.1:0),
         win:{fx:{pol:2,cap:2}, out:"The interim government keeps the program. Services never stop."},
         lose:{fx:{pol:-8,adopt:-2}, out:"Without a legal anchor, the program is frozen during the review."}},
   lens:"Where governments change often, institutions (laws, budget lines, career teams) are what keep DPI alive."},
  {t:"Brief the interim ministers on what citizens already use", fx:{pol:4},
   out:"The new team sees services people rely on and decides not to touch them.",
   lens:"Visible, delivered services are hard for any government to switch off."},
  {t:"Pause new work until the political situation settles", fx:{pol:1,adopt:-2},
   out:"Nothing breaks, and nothing moves for two quarters.",
   lens:"Waiting out instability is safe but slow. Build continuity into the program instead."}]},

{id:"t_fragile_pm", cat:"Political", ph:"BS", trait:["fragilePolitics"], title:"Another new prime minister",
 text:"{country} has a new prime minister, the third in two years. The cabinet is reshuffled again.",
 opts:[
  {t:"Hand over a one-page status and the next three milestones", fx:{pol:3,trust:1},
   out:"The new cabinet adopts the milestones as its own.",
   lens:"Short, clear handovers help programs survive frequent changes at the top."},
  {t:"Keep the program low-profile and out of the news", fx:{pol:1,eco:-1},
   out:"The program survives quietly. Few ministers know what it does.",
   lens:"Low visibility protects a program from politics, but also from support."}]},

{id:"t_federal", cat:"Political", ph:"DB", trait:["federal"], title:"The provinces go their own way",
 text:"Several states in {country} announce their own systems. Governors want autonomy, not a national platform.",
 opts:[

function openMarket(force){
  const rnd=a=>a[Math.floor(Math.random()*a.length)], kinds=[];
  if(G.blocks.length<BLOCKS.length) kinds.push("block");
  if(realUcs().length<USECASES.length-1 && (phaseOf(G.turn)!=="D"||G.ucs.includes("gen"))) kinds.push("uc");
  if(G.focus==null && G.role==="adv" && G.portfolio.length<(G.stats.rep>=60?6:4) && G.stats.rep>=35) kinds.push("country");
  if(Object.values(BOOTCAMPS).some(b=>!has(G,b.flag)) && phaseOf(G.turn)!=="D") kinds.push("bootcamp");
  const pool=kinds.filter(k=>k!==G.lastKind);
  const noRail=GENERIC.some(x=>x.id===G.block)&&!G.blocks.some(b=>b!==undefined&&!dpiExisting(G.country).includes(b));
  const kind=(force&&kinds.includes(force))?force:(noRail&&kinds.includes("block"))?"block":(G.ucs.includes("gen")&&kinds.includes("uc"))?"uc":rnd(pool.length?pool:kinds); if(!kind) return null;
  let ids;
  if(kind==="country"){
    const taken=[G.country,...G.portfolio.map(p=>p.id),...(G.lost||[]).map(l=>l.id)], free=WORLD.filter(c=>!taken.includes(c.id));
    const inR=free.filter(c=>REGION_OF[c.id]===REGION_OF[G.country]), outR=free.filter(c=>REGION_OF[c.id]!==REGION_OF[G.country]);
    /* Larger countries notice CDPI as its reputation grows. */
    const pw=G.stats.rep>=60?0.9:G.stats.rep>=45?0.6:0.3;
    const wrnd=a=>{ const w=a.map(c=>Math.pow(c.pop,pw)); let r=Math.random()*w.reduce((x,y)=>x+y,0); for(let i=0;i<a.length;i++){ r-=w[i]; if(r<=0) return a[i]; } return a[a.length-1]; };
    const a=inR.length?wrnd(inR):wrnd(free), rest=(outR.length?outR:free).filter(c=>c.id!==a.id), b=wrnd(rest);
    ids=[a.id,b.id];
  } else if(kind==="bootcamp"){
    ids=Object.keys(BOOTCAMPS).filter(k=>!has(G,BOOTCAMPS[k].flag));
  } else if(kind==="block"){
    const free=BLOCKS.filter(b=>!G.blocks.includes(b.id)).map(b=>b.id);
    const lean=(GENERIC.find(x=>x.id===G.block)||{}).lean;
    const first=lean&&free.includes(lean)?lean:free.includes("ai")&&Math.random()<0.6?"ai":rnd(free);
    ids=[first]; const rest=free.filter(x=>x!==first); if(rest.length) ids.push(rnd(rest));
  } else {
    const free=USECASES.filter(u=>!u.general&&!G.ucs.includes(u.id)).map(u=>u.id);
    const first=rnd(free); ids=[first]; const rest=free.filter(x=>x!==first); if(rest.length) ids.push(rnd(rest));
  }
  G.market={kind,ids}; G.lastKind=kind; G.lastMarket=G.turn;
  return buildMarket();
}

const railsText=()=>{ const n=G.blocks.map(id=>BLOCKS.find(x=>x.id===id).name); if(!n.length) return block(G).phrase; return n.length<3?n.join(" and "):n.slice(0,-1).join(", ")+" and "+n[n.length-1]; };

function swapIn(i){ G.mainCtx=pickKeys(G); const p=G.portfolio[i]; p.ctx.stats.rep=G.stats.rep; Object.assign(G,p.ctx); G.focus=i; }

/* People reached = public adoption plus people served by private services built on the rails (capped at 98%). */
function allRows(){
  const row=(id,st,x)=>{ const reach=Math.min(98,st.adopt+(st.priv||0)), base=st.base??reach;
    return {id, adopt:st.adopt, priv:st.priv||0, reach, base, gain:Math.max(0,reach-base), trust:st.trust, ...x}; };
  const m=G.focus==null?G:G.mainCtx, rows=[row(m.country,m.stats,{main:true, focus:G.focus==null})];
  (G.portfolio||[]).forEach((p,i)=>{ const st=G.focus===i?G.stats:(p.ctx?p.ctx.stats:p); rows.push(row(p.id,st,{focus:G.focus===i})); });
  return rows;
}

/* Decision windows are evenly spaced: 4 a year in the full game (quarterly), 2 or 1 in the shorter versions. */
function schedule(n){ const w=[]; for(let i=0;i<n;i++) w.push(2+Math.round(i*HORIZON/n)); return w; }
const weekOf=t=>G.weeks[Math.min(t,G.weeks.length-1)];
function elapsed(w){ return "Year "+Math.min(10,Math.floor(w/52)+1)+" · Q"+(Math.min(3,Math.floor((w%52)/13))+1); }
function shortElapsed(w){ return "Y"+Math.min(10,Math.floor(w/52)+1)+"Q"+(Math.min(3,Math.floor((w%52)/13))+1); }
function calendar(w){ const d=new Date(START.getTime()+w*7*864e5); return d.toLocaleDateString("en-GB",{month:"short",year:"numeric"}); }
function phaseOf(t){ const w=weekOf(t); return w<78?"D":w<208?"B":"S"; }
function gapAfter(t){ return (t+1<G.weeks.length?G.weeks[t+1]:HORIZON)-G.weeks[t]; }
function gapText(weeks){
  if(weeks<9) return weeks+" weeks";
  if(weeks<80) return Math.round(weeks/4.345)+" months";

  if(ego) out=tpl(out)+" "+ego;
  G.res={antiDpi:isAnti, ego:!!ego, forc:forOf(s), cat:s.cat, title:tpl(s.title), choice:tpl(o.t), out:tpl(out), lens:privFail?"A private ecosystem needs to be strong before it can carry services at scale. Build it first with open APIs, certification and clear rules.":tpl(o.lens), privFail, delta:choiceDelta, drift:driftDelta,
         gap:gapText(gapAfter(G.turn)), gamble, ms, foreshadow, last:G.turn+1>=G.total, advice};
  G.screen="result";
  render();
}

function rollNews(){
  if(has(G,"lawDrafted") && !has(G,"lawPassed") && !G.queue.some(q=>q.id==="fu_law") && Math.random()<0.45) return LAWVOTE;
  if(Math.random()>0.4*Math.sqrt(20/G.total)) return null;
  const pool=NEWS.filter(n=>!G.usedNews.includes(n.id) && n.cond(G));
  if(!pool.length) return null;
  const n=pool[Math.floor(Math.random()*pool.length)];
  G.usedNews.push(n.id);
  return n;
}

/* Advisor loses the main country (sacked, or influence gone) but still advises others: move to the strongest one. */
function relocate(){
  const lost=country(G), why=has(G,"sacked")?"sacked":"ignored";
  const best=[...G.portfolio].sort((a,b)=>b.ctx.stats.adopt-a.ctx.stats.adopt)[0], nc=byId(best.id);
  G.lost.push({id:lost.id, turn:G.turn, why});
  G.portfolio=G.portfolio.filter(p=>p!==best);
  const keep=["funded","fiftyIn5","caseStudy","electionPassed"].filter(f=>has(G,f));
  const rep=clamp(G.stats.rep-(why==="sacked"?15:8)), before=G.stats.rep;
  Object.assign(G,best.ctx);
  G.flags=[...new Set([...G.flags,...keep])];
  G.stats={...G.stats, rep, pol:Math.min(G.stats.pol,Math.round(clamp(20+rep/4,15,45)))};
  G.delta={rep:rep-before};
  G.news={title:`${why==="sacked"?"Sacked in":"Shut out of"} ${lost.name}. Carrying on in ${nc.name}.`,
    text:`${why==="sacked"?`The government of ${lost.name} ended CDPI's engagement.`:`The government of ${lost.name} has stopped listening to CDPI.`} Your work continues in the other countries you advise, and ${nc.name} becomes your main engagement. CDPI's reputation has taken a hit.`,
    delta:G.delta, ms:[]};
  G.screen="news";
}
/* A country advised in parallel can be lost on its own, without ending the game. */
function portfolioLoss(){
  const s=G.stats, c=country(G);
  const why=has(G,"sacked")?"sacked":s.pol<=0?"ignored":s.trust<=0?"trust":s.cash<0?"money":null;
  if(!why) return null;
  G.lost.push({id:c.id, turn:G.turn, why:why==="sacked"?"sacked":"ignored"});
  const txt={sacked:`The government of ${c.name} ended CDPI's engagement after it was seen to take a political side.`,
             ignored:`The government of ${c.name} has stopped listening to CDPI.`,
             trust:`Public trust in ${c.name}'s program collapsed and it was suspended.`,
             money:`${c.name}'s program ran out of money and was frozen.`}[why];
  return {title:`Engagement ended in ${c.name}`, text:`${txt} Your work continues in the other countries you advise.`, forId:c.id};
}
function checkWin(){
  if(!G.won && impactReached()>=GOAL){ const reached=impactReached(); swapOut(); G.won={turn:G.turn, reached}; G.screen="end"; saveHof(); render(); scrollTo(0,0); return true; }
  return false;
}
function nextInRound(i){
  if(G.role==="adv" && i<G.portfolio.length){ swapIn(i); G.delta={}; pickScenario(); render(); scrollTo(0,0); return true; }
  return false;
}
function endWindow(){
  driftGlobal();
  G.turn++;
  if(G.turn>=G.total){ G.screen="end"; saveHof(); render(); scrollTo(0,0); return; }
  /* Program lead: when the champion minister falls in a reshuffle, the program lead falls too. Weak political capital makes it likely. */
  const weak=G.stats.pol<20 || G.stats.trust<20 || (weekOf(G.turn)>=156 && G.stats.adopt<5);
  if(G.role==="gov" && G.turn>=4 && weak && Math.random()<0.25){
    const why=G.stats.pol<20?"your political support has run dry":G.stats.trust<20?"public trust in the program has collapsed":"after three years, almost nobody uses the rails";
    G.over={title:"Fired in a reshuffle", reshuffle:true, text:`You championed ${block(G).name}, but ${why}. In a cabinet reshuffle, the new minister replaces you as program lead.`};
    G.screen="over"; saveHof(); render(); scrollTo(0,0); return;
  }
  const n=rollNews();
  if(n && n.opts){ G.crisis={id:n.id, title:tpl(n.title), text:tpl(n.intro)}; G.screen="crisis"; render(); return; }
  if(n){
    const before={...G.stats}, r=n.run(G);
    applyFx(scaleFx(r.fx||{})); (r.set||[]).forEach(addFlag); (r.clr||[]).forEach(rmFlag);
    G.delta=diff(before,G.stats);
    const ms=checkMilestones();
    G.news={title:tpl(n.title), text:tpl(r.text), delta:G.delta, ms};
    G.screen="news"; render(); return;
  }
  G.delta={}; pickScenario(); render();
}
function advance(){
  if((G.screen==="result"||G.screen==="news") && checkWin()) return;
  /* Finished a decision for a country advised in parallel. */
  if(G.focus!=null && G.screen==="result"){
    const idx=G.focus, loss=portfolioLoss(); swapOut();
    if(loss){
      G.portfolio.splice(idx,1); const b=G.stats.rep; applyFx({rep:-6});
      G.news={title:loss.title, text:loss.text, delta:{rep:G.stats.rep-b}, ms:[], forId:loss.forId}; G.screen="news"; G.resume=idx; render(); return;
    }
    if(nextInRound(idx+1)) return;
    return endWindow();
  }
  if(G.screen==="news" && G.resume!=null){ const i=G.resume; G.resume=null; if(nextInRound(i)) return; return endWindow(); }
  /* Main country. */
  if((G.screen==="result"||G.screen==="news") && G.role==="adv" && G.portfolio.length && (has(G,"sacked")||G.stats.pol<=0)){
    relocate(); render(); scrollTo(0,0); return;
  }
  if(G.screen==="result" || G.screen==="news"){
    const r=overReason();
    if(r){ G.over=r; G.screen="over"; saveHof(); render(); scrollTo(0,0); return; }
  }
  if(G.screen==="result"){ if(nextInRound(0)) return; return endWindow(); }
  G.delta={}; pickScenario(); render();
}

function resolveCrisis(i){
  if(G.screen!=="crisis") return;
  const n=NEWS.find(x=>x.id===G.crisis.id), o=n.opts[i]; if(!o) return;
  const before={...G.stats}, r=o.run(G);
  applyFx(scaleFx(r.fx||{})); (r.set||[]).forEach(addFlag); (r.clr||[]).forEach(rmFlag);
  G.delta=diff(before,G.stats);
  const ms=checkMilestones();
  G.news={title:G.crisis.title, text:tpl(r.text), delta:G.delta, ms, choice:tpl(o.t)};
  G.screen="news"; render();
}

function score(){
  const s=G.stats;
  const raw=(s.adopt*1.0 + s.trust*0.6 + s.eco*0.4 + s.cap*0.3 + G.ms.length*6 + Math.min(Math.max(s.cash,0),60)*0.2
    + (G.role==="adv"&&G.advised ? 20*G.accepted/G.advised : 0)
    + 4*((G.blocks||[1]).length-1) + 3*Math.max(0,(G.ucs||[]).filter(u=>u!=="gen").length-1)
    + (G.role==="adv" ? 0.3*(G.stats.rep||0) : 0)
    + (G.role==="adv" ? (G.portfolio||[]).reduce((a,p)=>a+3+(p.ctx?p.ctx.stats.adopt:p.adopt)/10,0) : 0));;
  /* Normalised so the same thresholds mean the same thing at every pace. */
  return Math.round(raw/(1.45*Math.pow(G.total/20,0.22)) + (G.won?60:0));
}
function rating(sc){
  if(sc>=200) return ["Global DPI reference","Delegations from around the world come to learn from you."];
  if(sc>=170) return ["Rails in place","A national DPI that others build on."];
  if(sc>=140) return ["Solid foundations","The rails work. Scale and trust still need care."];
  if(sc>=110) return ["Pilot purgatory","Promising pieces that never quite became infrastructure."];
  return ["Digital white elephant","Expensive, underused, and hard to defend."];
}

/* Hall of fame: per-browser convenience only. */
const hofRank=(a,b)=>((b.reached!=null)-(a.reached!=null)) || (b.reached||0)-(a.reached||0) || (b.score||0)-(a.score||0);
function loadHof(){ try{ return JSON.parse(localStorage.getItem("btr-hof")||"[]").sort(hofRank); }catch(e){ return []; } }
function saveHof(){
  try{
    const sc=G.over?Math.round(score()*0.5):score();
    const list=loadHof();
    list.push({won:!!G.won, reached:Math.round(impactReached()), team:G.team||"Unnamed team", role:ROLES[G.role].short, country:country(G).name, flag:country(G).flag, block:block(G).name, score:sc, over:!!G.over});
    list.sort(hofRank);
    localStorage.setItem("btr-hof",JSON.stringify(list.slice(0,8)));
  }catch(e){}
}
